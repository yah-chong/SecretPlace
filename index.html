<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>揪團定位 · 活動代號地圖 (多站行程打卡清單)</title>
  <!-- Leaflet 核心樣式 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- 自定義圖示與 PWA 風格 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%234f46e5'/><stop offset='50%' stop-color='%237c3aed'/><stop offset='100%' stop-color='%23db2777'/></linearGradient></defs><circle cx='256' cy='256' r='240' fill='url(%23bg)'/><circle cx='256' cy='240' r='80' fill='white' opacity='0.9'/><circle cx='256' cy='400' r='40' fill='white' opacity='0.9'/><text x='256' y='470' font-size='70' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>📍</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #0b0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
    }

    .app-container {
      width: 100%;
      max-width: 1280px;
      height: 98vh;
      max-height: 98vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0b0f1a;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 16px;
      overflow: hidden;
    }

    /* 頂部標題與狀態 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px;
      color: #f0f3ff;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-section h1 {
      font-size: 1.4rem;
      font-weight: 600;
      background: linear-gradient(135deg, #a5b4fc, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .geo-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: #cbd5e1;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .geo-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 10px #f97316;
      transition: all 0.2s;
    }

    .geo-dot.active {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }

    .geo-dot.off {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-refresh:active {
      transform: scale(0.96);
    }

    /* 地圖容器 */
    .map-wrapper {
      flex: 1;
      min-height: 280px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      background: #1a1e2c;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #1a1e2c;
    }

    /* 地圖上的自定義圖標樣式 (用 divIcon 實現) */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
    }

    .marker-pin {
      width: 36px;
      height: 36px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .marker-pin span {
      transform: rotate(45deg);
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* 右側或下方的清單面板 - 移動端自適應 */
    .list-panel {
      background: rgba(20, 25, 40, 0.9);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 16px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: #4f46e5 #1e1e2e;
    }

    .list-panel::-webkit-scrollbar {
      width: 5px;
    }

    .list-panel::-webkit-scrollbar-track {
      background: #1e1e2e;
      border-radius: 10px;
    }

    .list-panel::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 10px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e2e8f0;
      font-weight: 500;
      font-size: 0.9rem;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 4px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.15s;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .checklist-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .checklist-item.visited {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.25);
    }

    .checklist-item.visited .item-name {
      text-decoration: line-through;
      color: #86efac;
    }

    .item-check {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.15s;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .checklist-item.visited .item-check {
      background: #22c55e;
      color: white;
      border-color: #22c55e;
    }

    .item-name {
      flex: 1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-coords {
      font-size: 0.7rem;
      color: #6b7280;
      font-family: monospace;
      white-space: nowrap;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions button {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #cbd5e1;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.15s;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-actions button:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .item-actions button:active {
      transform: scale(0.9);
    }

    .empty-state {
      color: #6b7280;
      text-align: center;
      padding: 20px 10px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* 右下角座標提示 */
    .location-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 800;
      pointer-events: none;
      font-family: monospace;
      letter-spacing: 0.3px;
    }

    /* 手機端調整 */
    @media (max-width: 640px) {
      .app-container {
        padding: 10px;
        gap: 10px;
        height: 99vh;
        max-height: 99vh;
        border-radius: 24px;
      }

      .title-section h1 {
        font-size: 1rem;
      }

      .badge {
        font-size: 0.65rem;
        padding: 2px 8px;
      }

      .geo-status {
        padding: 4px 10px;
        font-size: 0.7rem;
      }

      .btn-refresh {
        padding: 4px 12px;
        font-size: 0.7rem;
      }

      .map-wrapper {
        min-height: 200px;
      }

      .list-panel {
        max-height: 180px;
        padding: 10px 12px;
      }

      .checklist-item {
        padding: 6px 8px;
        gap: 8px;
        font-size: 0.8rem;
      }

      .item-coords {
        display: none;
      }

      .item-actions button {
        width: 24px;
        height: 24px;
        font-size: 0.75rem;
      }
    }

    /* 自定義 popup 樣式 */
    .leaflet-popup-content-wrapper {
      background: #1e1e2e;
      color: #f0f3ff;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      font-family: system-ui, sans-serif;
    }

    .leaflet-popup-tip {
      background: #1e1e2e;
    }

    .popup-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #a5b4fc;
    }

    .popup-desc {
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部狀態列 -->
    <div class="header-bar">
      <div class="title-section">
        <h1>📍 揪團定位 · 活動代號</h1>
        <span class="badge">多站行程</span>
      </div>
      <div class="status-group">
        <div class="geo-status">
          <span class="geo-dot" id="geoDot"></span>
          <span id="geoText">定位中...</span>
        </div>
        <button class="btn-refresh" id="refreshLocationBtn" title="重新定位">
          🔄 重新定位
        </button>
      </div>
    </div>

    <!-- 地圖區 -->
    <div class="map-wrapper">
      <div id="map"></div>
      <div class="location-hint" id="locationHint">尚未取得座標</div>
    </div>

    <!-- 打卡清單面板 -->
    <div class="list-panel" id="listPanel">
      <div class="list-header">
        <span>📋 行程打卡清單</span>
        <span id="progressText" style="font-size:0.75rem; color:#94a3b8;">0/0 完成</span>
      </div>
      <div id="checklistContainer">
        <!-- 動態生成清單項目 -->
        <div class="empty-state">
          <span>🗺️ 尚未新增站點</span>
          <span style="font-size:0.7rem;">點擊地圖或使用定位按鈕新增站點</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function() {
      // ---------- 初始化地圖 ----------
      // 使用 OpenStreetMap 圖層（穩定、無需 token）
      const map = L.map('map', {
        center: [25.0330, 121.5654], // 預設台北
        zoom: 14,
        zoomControl: true,
        attributionControl: true,
        zoomControl: true,
        fadeAnimation: true,
        markerZoomAnimation: true
      });

      // 使用暗色風格圖層 (CARTO dark matter) 更符合質感
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19,
        minZoom: 3
      }).addTo(map);

      // ---------- 全局變量 ----------
      let currentPositionMarker = null; // 當前位置標記
      let stationMarkers = [];          // 所有站點標記 (Marker 實例)
      let stations = [];               // 站點數據 { id, name, lat, lng, visited }
      let nextId = 1;

      // 地圖元素
      const geoDot = document.getElementById('geoDot');
      const geoText = document.getElementById('geoText');
      const locationHint = document.getElementById('locationHint');
      const checklistContainer = document.getElementById('checklistContainer');
      const progressText = document.getElementById('progressText');

      // 更新定位狀態顯示
      function updateGeoStatus(status, message) {
        geoDot.classList.remove('active', 'off');
        if (status === 'active') {
          geoDot.classList.add('active');
          geoText.textContent = message || '定位已開啟';
        } else if (status === 'off') {
          geoDot.classList.add('off');
          geoText.textContent = message || '定位關閉 / 被拒絕';
        } else {
          geoText.textContent = message || '定位中...';
        }
      }

      // 更新座標提示
      function updateLocationHint(lat, lng) {
        if (lat && lng) {
          locationHint.textContent = `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        } else {
          locationHint.textContent = '尚未取得座標';
        }
      }

      // ---------- 渲染打卡清單 ----------
      function renderChecklist() {
        if (stations.length === 0) {
          checklistContainer.innerHTML = `
            <div class="empty-state">
              <span>🗺️ 尚未新增站點</span>
              <span style="font-size:0.7rem;">點擊地圖或使用「新增站點」按鈕</span>
            </div>
          `;
          progressText.textContent = `0/0 完成`;
          return;
        }

        let html = '';
        stations.forEach(station => {
          const visitedClass = station.visited ? 'visited' : '';
          html += `
            <div class="checklist-item ${visitedClass}" data-id="${station.id}">
              <div class="item-check" data-id="${station.id}">
                ${station.visited ? '✓' : ''}
              </div>
              <div class="item-name" title="${station.name}">${station.name}</div>
              <div class="item-coords">${station.lat.toFixed(4)}, ${station.lng.toFixed(4)}</div>
              <div class="item-actions">
                <button class="fly-btn" data-id="${station.id}" title="飛往此站">✈️</button>
                <button class="delete-btn" data-id="${station.id}" title="刪除站點">🗑️</button>
              </div>
            </div>
          `;
        });

        checklistContainer.innerHTML = html;

        // 更新進度
        const visitedCount = stations.filter(s => s.visited).length;
        progressText.textContent = `${visitedCount}/${stations.length} 完成`;

        // 綁定勾選事件
        document.querySelectorAll('.item-check').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(el.dataset.id);
            toggleVisited(id);
          });
        });

        // 綁定飛往按鈕
        document.querySelectorAll('.fly-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            flyToStation(id);
          });
        });

        // 綁定刪除按鈕
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            deleteStation(id);
          });
        });

        // 點擊清單項目本體也飛往 (但排除按鈕)
        document.querySelectorAll('.checklist-item').forEach(item => {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.item-check') || e.target.closest('button')) return;
            const id = parseInt(item.dataset.id);
            flyToStation(id);
          });
        });
      }

      // 切換打卡狀態
      function toggleVisited(id) {
        const station = stations.find(s => s.id === id);
        if (station) {
          station.visited = !station.visited;
          // 更新標記樣式 (可選改變標記顏色)
          updateMarkerStyle(id);
          renderChecklist();
        }
      }

      // 更新標記樣式（依據 visited 狀態改變顏色）
      function updateMarkerStyle(id) {
        const station = stations.find(s => s.id === id);
        if (!station) return;
        const marker = stationMarkers.find(m => m._stationId === id);
        if (marker && marker._icon) {
          const pinDiv = marker._icon.querySelector('.marker-pin');
          if (pinDiv) {
            pinDiv.style.background = station.visited ? '#22c55e' : '#4f46e5';
          }
        }
      }

      // 飛往站點
      function flyToStation(id) {
        const station = stations.find(s => s.id === id);
        if (station) {
          map.flyTo([station.lat, station.lng], 16, { duration: 0.8 });
        }
      }

      // 刪除站點
      function deleteStation(id) {
        const index = stations.findIndex(s => s.id === id);
        if (index === -1) return;

        // 移除標記
        const marker = stationMarkers.find(m => m._stationId === id);
        if (marker) {
          map.removeLayer(marker);
          stationMarkers = stationMarkers.filter(m => m._stationId !== id);
        }

        // 從數據中移除
        stations.splice(index, 1);

        // 重新渲染清單
        renderChecklist();

        // 如果所有站點都刪除，地圖視野回到默認？不用
      }

      // ---------- 新增站點 (使用目前地圖中心或點擊位置) ----------
      function addStation(lat, lng, name) {
        const id = nextId++;
        // 如果沒有提供名稱，基於座標生成
        if (!name) {
          name = `站點 ${id} (${lat.toFixed(3)}, ${lng.toFixed(3)})`;
        }

        const station = {
          id,
          name,
          lat,
          lng,
          visited: false
        };
        stations.push(station);

        // 建立自定義圖標
        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div class="marker-pin" style="background: #4f46e5;"><span>${id}</span></div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 36],
          popupAnchor: [0, -36]
        });

        // 建立標記
        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
        marker._stationId = id; // 關聯 ID

        // 綁定點擊彈窗
        marker.bindPopup(`
          <div class="popup-title">${station.name}</div>
          <div class="popup-desc">📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
          <div class="popup-desc" style="margin-top:6px; color:#a5b4fc;">點擊地圖可新增更多站點</div>
        `);

        stationMarkers.push(marker);

        // 重新渲染清單
        renderChecklist();

        // 可選: 將地圖移動到此新站點 (如果使用者是點擊地圖新增，就不強制移動)
        // 這裡不移動，但清單會出現
      }

      // ---------- 定位相關 ----------
      function locateUser() {
        if (!navigator.geolocation) {
          updateGeoStatus('off', '瀏覽器不支援定位');
          return;
        }

        updateGeoStatus('', '定位中...');

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            updateGeoStatus('active', `定位已開啟 (精度 ±${position.coords.accuracy.toFixed(0)}m)`);
            updateLocationHint(latitude, longitude);

            // 移除舊的當前位置標記
            if (currentPositionMarker) {
              map.removeLayer(currentPositionMarker);
            }

            // 建立當前位置標記 (使用藍色圓點樣式)
            const currentIcon = L.divIcon({
              className: 'custom-marker',
              html: `<div style="background: #3b82f6; width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(59,130,246,0.3), 0 0 20px #3b82f6; border: 3px solid white;"></div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            });

            currentPositionMarker = L.marker([latitude, longitude], { icon: currentIcon }).addTo(map);
            currentPositionMarker.bindPopup('📌 您目前的位置');

            // 地圖飛到當前位置 (但若已經有站點，不要過度干擾？第一次定位時飛過去)
            if (stations.length === 0) {
              map.flyTo([latitude, longitude], 15, { duration: 1.0 });
            } else {
              // 輕微移動到附近？可選，此處只平移不縮放
              map.panTo([latitude, longitude]);
            }
          },
          (error) => {
            let msg = '定位失敗';
            switch (error.code) {
              case error.PERMISSION_DENIED:
                msg = '定位被拒絕，請開啟瀏覽器定位權限';
                break;
              case error.POSITION_UNAVAILABLE:
                msg = '無法取得位置資訊';
                break;
              case error.TIMEOUT:
                msg = '定位逾時，請重試';
                break;
            }
            updateGeoStatus('off', msg);
            updateLocationHint(null, null);
            console.warn('定位錯誤:', error);
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 60000
          }
        );
      }

      // ---------- 事件綁定 ----------
      // 地圖點擊新增站點 (雙擊或單擊？為了避免乾擾，使用雙擊新增)
      map.on('dblclick', (e) => {
        const { lat, lng } = e.latlng;
        // 簡單命名
        const name = `站點 ${nextId} (${lat.toFixed(3)}, ${lng.toFixed(3)})`;
        addStation(lat, lng, name);
      });

      // 也可以按鈕新增？但沒有按鈕，可以加一個快捷鍵？方便起見，雙擊地圖即可。
      // 另外，如果使用者想快速新增目前定位點作為站點，可以長按？但這裡提供一個簡單方式：
      // 點擊地圖上的任意位置(單擊)？為了避免誤觸，維持雙擊。
      // 但為了更直覺，我們加一個 "新增當前位置" 的功能？可以通過點擊定位按鈕後再點擊地圖？
      // 新增一個小提示：雙擊地圖新增站點。

      // 更新定位按鈕
      document.getElementById('refreshLocationBtn').addEventListener('click', () => {
        locateUser();
      });

      // 初始化時嘗試定位
      window.addEventListener('load', () => {
        // 延遲一點確保地圖已加載
        setTimeout(() => {
          locateUser();
          // 如果定位失敗，至少顯示預設位置
          if (stations.length === 0) {
            // 為了演示，可以加一些預設站點？不，留空讓使用者自行新增。
            // 但為了避免空清單太單調，可加提示
            renderChecklist();
          }
        }, 300);
      });

      // 地圖加載完成後，如果沒有定位成功，使用默認位置標記？不用。

      // 備用: 如果地圖雙擊新增站點，更新提示
      // 在 map-wrapper 加提示文字? 已經有 location-hint

      // 監聽地圖移動更新座標提示？不需要

      // 添加一個小功能：顯示地圖中心的座標？不用

      // 初始化清單渲染
      renderChecklist();

      // 因為定位可能失敗，若地理定位被關閉，顯示提示
      // 但若用戶沒有開啟定位，我們也可以讓使用者雙擊地圖新增站點。
      // 在定位失敗時，如果地圖上沒有站點，可以預設一個站點？不，讓使用者自己加。

      // 提供一個快速新增目前位置為站點的功能？可以點擊某個按鈕？但沒有UI。
      // 為了方便，如果定位成功，在地圖上顯示的當前位置標記，雙擊該標記並不能新增站點。
      // 沒關係，雙擊地圖任意位置即可新增站點。已實現。

      // 但若使用者想新增當前位置為站點，可以拖動地圖中心到當前位置，然後雙擊？麻煩。
      // 加一個按鈕: 點擊定位按鈕後，如果定位成功，可以再點擊一個 "將當前位置設為站點"？
      // 但未提供UI，所以暫時不加。

      // 但我們可以讓使用者在定位成功後，雙擊地圖上自己的位置來新增站點。已經支持。
      // 已經足夠。

      // 另外，定位成功時，如果使用者雙擊自己的位置，會新增站點，但名字預設。
      // 一切正常。

      // 監聽地圖點擊(單擊)顯示座標？不用。

      // 如果定位被關閉，地圖上仍可雙擊新增站點。

      // 初始化時，如果地圖上沒有任何標記，可以顯示提示，已做。

      // 最後，處理行動裝置縮放
      // 地圖已設置。

      // 修正: 有些瀏覽器需要用戶手勢才能定位，但我們在load時請求，可能被拒絕。
      // 所以用戶點擊重新定位按鈕時再請求，較可靠。

      // 再額外: 在清單面板中，點擊站點名稱也可飛往。
      // 已完成。

      // 把地圖雙擊提示加入
      console.log('地圖雙擊可新增站點');

      // 如果定位失敗，我們將geoDot設為紅色，並提示。
      // 補救: 如果用戶未開啟定位，地圖仍可用，雙擊新增站點。

      // 初始化完成
    })();
  </script>
</body>
</html>
