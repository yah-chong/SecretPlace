<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>揪團定位 · 活動代號地圖 (地標搜尋升級版)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden;background:#000;}
  .screen{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---------- 加入畫面 ---------- */
  #joinScreen{
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:#000; color:#fff; overflow-y:auto;
  }
  .card{
    width:100%;max-width:450px;background:#111;
    border:2px solid #444;border-radius:16px;padding:32px 24px;
    box-shadow:0 10px 30px rgba(255,255,255,0.1);
  }
  .card h1{margin:0 0 12px;font-size:32px;letter-spacing:1px;color:#fff;}
  .sub{margin:0 0 24px;font-size:18px;color:#ddd;line-height:1.6;font-weight:500;}
  label{display:block;font-size:18px;color:#ffeb3b;margin:20px 0 8px;font-weight:bold;letter-spacing:1px}
  input{
    width:100%;padding:18px;border-radius:12px;border:3px solid #555;
    background:#222;color:#fff;font-size:22px;font-weight:bold;outline:none;transition:.2s;
  }
  input:focus{border-color:#ffeb3b;background:#000;}
  input::placeholder{color:#888;font-weight:normal;}
  button.primary{
    width:100%;margin-top:32px;padding:20px;border:0;border-radius:12px;font-size:24px;font-weight:900;
    background:#ffeb3b;color:#000;cursor:pointer;
    box-shadow:0 6px 15px rgba(255,235,59,.4);transition:.15s;
  }
  button.primary:active{transform:scale(.96);background:#fbc02d;}
  .hint{font-size:16px;color:#aaa;text-align:center;margin:20px 0 0;line-height:1.6}

  /* ---------- 地圖畫面 ---------- */
  #mapScreen{background:#000}
  #map{position:absolute;inset:0;background:#000}

  /* 頂部導覽列 */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;justify-content:space-between;align-items:center;
    padding:12px;padding-top:calc(12px + env(safe-area-inset-top));
    pointer-events:none;background:linear-gradient(to bottom, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0));
  }
  #topbar > * { pointer-events:auto; }
  .top-left-group { display:flex; gap:8px; align-items:center; }
  .top-right-group { display:flex; gap:8px; align-items:center; }

  .chip{
    background:#000;color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:bold;
    display:flex;gap:6px;align-items:center;border:2px solid #555;white-space:nowrap; 
  }
  .chip .lbl{color:#aaa;}
  .chip b{color:#ffeb3b;font-size:16px;}
  
  #topbar button{
    background:#000;color:#fff;border:2px solid #555;font-weight:bold;
    border-radius:8px;padding:8px 12px;font-size:15px;cursor:pointer;
    white-space:nowrap;
  }
  #leaveBtn{color:#ff5252!important;border-color:#ff5252!important;}
  
  #netDot{width:10px;height:10px;border-radius:50%;background:#ff3d00;transition:.3s}
  #netDot.on{background:#00e676;box-shadow:0 0 8px #00e676}

  /* 🔍 搜尋集合點按鈕與面板 */
  #searchToggleBtn {
    background: #ffeb3b !important; color: #000 !important; border-color: #ffeb3b !important;
  }
  
  #searchModal {
    position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8);
    display: flex; flex-direction: column; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top));
  }
  .search-box-card {
    background: #111; border: 2px solid #444; border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; max-width: 500px; width: 100%; margin: 0 auto;
  }
  .search-input-row { display: flex; gap: 8px; }
  .search-input-row input { font-size: 18px; padding: 12px; }
  .search-input-row button {
    background: #ffeb3b; color: #000; border: none; border-radius: 12px;
    padding: 0 20px; font-weight: bold; font-size: 16px; cursor: pointer; white-space: nowrap;
  }
  #searchResults {
    max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
  }
  .search-item {
    background: #222; border: 1px solid #444; padding: 14px; border-radius: 10px;
    color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .search-item:active { background: #333; border-color: #ffeb3b; }
  .close-search {
    background: #333; color: #fff; border: none; padding: 12px; border-radius: 10px;
    font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; margin-top: 10px;
  }

  /* 🎯 集合點膠囊橫條 */
  #targetBanner {
    position:absolute;left:12px;right:12px;bottom:calc(75px + env(safe-area-inset-bottom));z-index:999;
    background:rgba(17, 17, 17, 0.95);border:2px solid #ffeb3b;border-radius:30px;
    padding:6px 12px;color:#fff;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 6px 16px rgba(0,0,0,0.8);backdrop-filter:blur(4px);
  }
  #targetBanner .t-info { font-size:14px; font-weight:bold; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 50%; }
  #targetBanner .t-info span { color:#ffeb3b; font-size:15px; font-weight:900; }
  
  .target-banner-actions { display:flex; gap:6px; align-items:center; }
  #targetBanner .t-btn {
    background:#00e676;color:#000;border:none;padding:6px 12px;border-radius:20px;
    font-weight:900;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  #targetBanner .t-clear {
    background:#ff1744;color:#fff;border:none;padding:6px 12px;
    border-radius:20px;font-size:14px;font-weight:900;cursor:pointer;white-space:nowrap;
  }
  #targetBanner .t-clear:active { background:#d50000; }

  /* 控制按鈕組 (SOS & 定位跟隨) */
  .control-group {
    position:absolute;right:16px;top:40%;transform:translateY(-50%);z-index:1000;
    display:flex;flex-direction:column;gap:14px;
  }
  .ctrl-btn {
    width:64px;height:64px;border-radius:50%;border:3px solid #fff;
    background:#000;color:#fff;font-size:24px;font-weight:bold;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    flex-direction:column;line-height:1.2;
  }
  .ctrl-btn:active{transform:scale(.94)}
  
  #sosBtn { background:#d32f2f; border-color:#ff5252; color:#fff; animation: pulse 2s infinite; }
  #sosBtn.active { background:#ff1744; border-color:#fff; animation: alertFlash .5s infinite alternate; }
  #locBtn.following { background:#00e676; color:#000; border-color:#fff; }

  /* 底部面板 */
  #panel{
    position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:#111;
    border-top-left-radius:24px;border-top-right-radius:24px;
    border-top:3px solid #444;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:16px;font-weight:bold;color:#ccc;padding:4px 4px 8px;letter-spacing:1px;
    cursor:pointer;user-select:none;
  }
  .panel-head:active{opacity:0.7;}
  
  #peerList{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    max-height:38vh;
  }
  
  .peer{
    display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;
    background:#222;border:2px solid #333;margin-bottom:8px;cursor:pointer;transition:.15s;
  }
  .peer.sos-active { border-color:#ff1744; background:#3a0d0d; animation: alertFlash 1s infinite alternate; }
  .peer:active{background:#333;border-color:#ffeb3b;}
  .pdot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid #fff;}
  .pinfo{flex:1;min-width:0}
  
  .pname{color:#fff;font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;}
  .sos-tag { background:#ff1744; color:#fff; font-size:12px; padding:2px 6px; border-radius:4px; font-weight:bold; }
  .pmeta{color:#bbb;font-size:15px;font-weight:bold;margin-top:4px}
  .navbtn{
    background:#00e676;color:#000;text-decoration:none;font-size:16px;font-weight:900;
    padding:10px 16px;border-radius:8px;flex:0 0 auto;border:2px solid #000;
  }
  
  .empty{color:#ccc;font-size:18px;font-weight:bold;padding:16px 10px;text-align:center;line-height:1.6}

  /* 地圖標記樣式 */
  .pin{position:absolute;left:0;top:0}
  .pin .dot{
    position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;
    border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.6);
  }
  .pin .name{
    position:absolute;left:0;top:20px;transform:translateX(-50%);
    font-size:15px;font-weight:900;color:#000;background:#fff;
    padding:4px 10px;border-radius:8px;white-space:nowrap;border:2px solid #000;
  }
  .pin.me .dot{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 12px rgba(0,230,118,.5)}
  .pin.sos .dot { background:#ff1744!important; animation: sosPulse 0.8s infinite alternate; }
  .pin.sos .name { background:#ff1744; color:#fff; border-color:#fff; }

  .target-pin {
    font-size: 32px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    transform: translate(-50%, -100%);
  }

  .leaflet-tooltip.lineTip{
    background:#000;color:#ffeb3b;border:2px solid #fff;font-size:16px;font-weight:900;
    padding:6px 12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.6);
  }
  .leaflet-tooltip.lineTip::before{display:none}

  #loading{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;
    background:#000;color:#fff;padding:20px 30px;border-radius:12px;
    font-size:18px;font-weight:bold;text-align:center;line-height:1.8;border:3px solid #555;
    max-width:85vw;
  }
  #toast{
    position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);z-index:3000;
    background:#ffeb3b;color:#000;padding:16px 24px;border-radius:8px;font-weight:bold;
    font-size:18px;opacity:0;transition:.25s;pointer-events:none;
    border:3px solid #000;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes sosPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0px rgba(255,23,68,0.8); }
    100% { transform: scale(1.4); box-shadow: 0 0 0 20px rgba(255,23,68,0); }
  }
  @keyframes alertFlash {
    0% { opacity: 1; }
    100% { opacity: 0.4; }
  }
</style>
</head>
<body>

<!-- ============ 加入畫面 ============ -->
<div id="joinScreen" class="screen">
  <div class="card">
    <h1>📍 揪團定位</h1>
    <p class="sub">輸入同一組「活動代號」，就能在同一張地圖上即時看見彼此位置、搜尋地標設定集合點與一鍵 SOS 求助。</p>

    <label>活動代號（由發起人命名）</label>
    <input id="codeInput" placeholder="例如：2026旅遊" maxlength="30" autocomplete="off">

    <label>你的暱稱 / 姓名</label>
    <input id="nickInput" placeholder="例如：阿明" maxlength="12" autocomplete="off">

    <button id="joinBtn" class="primary">開始分享位置</button>
    <p class="hint">按下後請允許「GPS 定位權限」。<br>位置僅在同代號的群組內同步。</p>
  </div>
</div>

<!-- ============ 地圖畫面 ============ -->
<div id="mapScreen" class="screen hidden">
  <div id="map"></div>

  <!-- 頂部導覽列 -->
  <div id="topbar">
    <div class="top-left-group">
      <div class="chip"><span class="lbl">代號</span><b id="topCode">—</b></div>
      <div class="chip"><span id="netDot"></span><span class="lbl">上線</span><b id="topCount">1</b></div>
    </div>
    <div class="top-right-group">
      <button id="searchToggleBtn">🔍 找地點</button>
      <button id="copyBtn">🔗 邀請</button>
      <button id="leaveBtn">離開</button>
    </div>
  </div>

  <!-- 🔍 地點搜尋彈出視窗 -->
  <div id="searchModal" class="hidden">
    <div class="search-box-card">
      <h3 style="margin:0 0 8px; color:#ffeb3b; font-size:20px;">尋找集合地點</h3>
      <div class="search-input-row">
        <input id="searchInput" placeholder="輸入地名 (例如：左營高鐵站)" autocomplete="off">
        <button id="searchSubmitBtn">搜尋</button>
      </div>
      <div id="searchResults"></div>
      <button id="closeSearchModal" class="close-search">關閉</button>
    </div>
  </div>

  <!-- 🎯 集合點膠囊橫條 -->
  <div id="targetBanner" class="hidden">
    <div class="t-info"><span id="targetName">集合點</span> <span id="targetDist">計算中...</span></div>
    <div class="target-banner-actions">
      <a id="targetNavBtn" class="t-btn" href="#" target="_blank" rel="noopener">一鍵導航</a>
      <button id="clearTargetBtn" class="t-clear">取消集合點</button>
    </div>
  </div>

  <!-- 控制按鈕組 -->
  <div class="control-group">
    <button id="sosBtn" class="ctrl-btn" title="一鍵發送求救信號">SOS</button>
    <button id="locBtn" class="ctrl-btn" title="切換跟隨模式">◎<span style="font-size:10px;" id="locTxt">定位</span></button>
  </div>

  <div id="panel">
    <div class="panel-head" id="panelToggle">
      <span>👥 同伴列表（可點擊「找地點」設集合點）</span>
      <span id="toggleIcon" style="font-size:14px;color:#fff;">▼ 收合</span>
    </div>
    <div id="peerList"></div>
  </div>

  <div id="loading">正在取得定位…<br><span style="font-size:16px;color:#aaa">請允許瀏覽器定位權限</span></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  'use strict';

  const COLORS = ['#ff5252','#448aff','#ffb300','#00e676','#aa00ff','#00bcd4','#ff6d00','#3f51b5','#e91e63','#8bc34a'];
  const BROKER  = 'wss://broker.emqx.io:8084/mqtt';   
  const TOPIC_PREFIX = 'geoact/v1/';
  const PING_MS  = 15 * 1000;   

  const state = {
    id: 'u' + Math.random().toString(36).slice(2, 10),
    code: '', nickname: '', color: COLORS[0], topic: '',
    myPos: null, map: null, meMarker: null, line: null,
    client: null, watchId: null, firstFix: false, joined: false,
    isSOS: false,
    isFollowing: false, 
    targetPos: null,    
    targetName: '集合點',
    targetMarker: null
  };
  const peers = new Map();   

  const $ = s => document.querySelector(s);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg, ms) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), ms || 3000);
  }
  function hashColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function haversine(a, b) {                         
    const R = 6371000, rad = d => d * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 +
              Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function fmtDistSemantic(m) {
    if (m == null) return '距離未知';
    if (m < 30) return `就在你附近 (約 ${Math.round(m)} 公尺)`;
    if (m < 100) return `相當接近 (約 ${Math.round(m)} 公尺)`;
    if (m < 1000) return `步行距離 (約 ${Math.round(m)} 公尺)`;
    return `距離較遠 (${(m / 1000).toFixed(m < 10000 ? 2 : 1)} 公里)`;
  }
  
  function fmtDistSimple(m) {
    if (m == null) return '未知';
    if (m < 1000) return Math.round(m) + 'm';
    return (m / 1000).toFixed(1) + 'km';
  }

  function ago(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 10) return '剛剛';
    if (s < 60) return s + ' 秒前';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' 分鐘前';
    return Math.floor(m / 60) + ' 小時前';
  }

  /* ================= 地圖初始化與控制 ================= */
  function ensureMap(latlng) {
    if (state.map) return;
    state.map = L.map('map', { zoomControl: false, attributionControl: true }).setView(latlng, 17);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(state.map);

    state.map.on('dragstart', function() {
      if (state.isFollowing) setFollowMode(false);
    });

    peers.forEach(p => addPeerMarker(p));     
  }

  function iconFor(nickname, color, isMe, isSOS) {
    const sosClass = isSOS ? ' sos' : '';
    const meClass = isMe ? ' me' : '';
    return L.divIcon({
      className: '',
      html:
        '<div class="pin' + meClass + sosClass + '">' +
          '<div class="dot" style="background:' + (isSOS ? '#ff1744' : color) + '"></div>' +
          '<div class="name">' + (isSOS ? '🆘 ' : '') + esc(nickname) + '</div>' +
        '</div>',
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
  }

  function updateMeMarker() {
    if (!state.map || !state.myPos) return;
    const ll = [state.myPos.lat, state.myPos.lng];
    if (!state.meMarker) {
      state.meMarker = L.marker(ll, {
        icon: iconFor(state.nickname, '#00e676', true, state.isSOS),
        zIndexOffset: 1000,
        interactive: false
      }).addTo(state.map);
    } else {
      state.meMarker.setLatLng(ll);
      state.meMarker.setIcon(iconFor(state.nickname, '#00e676', true, state.isSOS));
    }
  }

  function addPeerMarker(p) {
    if (!state.map || p.marker) return;
    p.marker = L.marker([p.lat, p.lng], { icon: iconFor(p.nickname, p.color, false, p.isSOS) })
      .addTo(state.map)
      .on('click', () => focusPeer(p.id));
  }

  function clearLine() {
    if (state.line && state.map) { state.map.removeLayer(state.line); }
    state.line = null;
  }

  /* ================= 搜尋地點設定集合點 ================= */
  async function searchLocation(query) {
    if (!query.trim()) return toast('請輸入要搜尋的地點名稱');
    toast('正在搜尋地點...');
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`, {
        headers: { 'Accept-Language': 'zh-Hant' }
      });
      const data = await res.json();
      const resultsEl = $('#searchResults');
      resultsEl.innerHTML = '';

      if (!data.length) {
        resultsEl.innerHTML = '<div style="color:#aaa; text-align:center; padding:12px;">找不到相關地點，請嘗試更精確的關鍵字</div>';
        return;
      }

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.textContent = item.display_name;
        div.addEventListener('click', () => {
          const lat = parseFloat(item.lat);
          const lng = parseFloat(item.lon);
          const shortName = item.display_name.split(',')[0];
          setTargetPos(lat, lng, shortName, true);
          $('#searchModal').classList.add('hidden');
          if (state.map) state.map.setView([lat, lng], 16);
        });
        resultsEl.appendChild(div);
      });
    } catch (e) {
      toast('搜尋發生錯誤，請檢查網路');
    }
  }

  function setTargetPos(lat, lng, name, broadcast) {
    state.targetPos = { lat, lng };
    state.targetName = name || '集合點';
    if (!state.targetMarker && state.map) {
      const targetIcon = L.divIcon({
        className: 'target-pin',
        html: '🚩',
        iconSize: [32, 32],
        iconAnchor: [16, 32]
      });
      state.targetMarker = L.marker([lat, lng], { icon: targetIcon }).addTo(state.map);
    } else if (state.targetMarker) {
      state.targetMarker.setLatLng([lat, lng]);
    }

    updateTargetUI();
    if (broadcast) {
      send('set_target', { lat, lng, name: state.targetName });
      toast('🎯 已設定集合點：' + state.targetName);
    }
  }

  function clearTargetPos(broadcast) {
    state.targetPos = null;
    state.targetName = '集合點';
    if (state.targetMarker && state.map) {
      state.map.removeLayer(state.targetMarker);
      state.targetMarker = null;
    }
    updateTargetUI();
    if (broadcast) {
      send('clear_target');
      toast('已取消集合點');
    }
  }

  function updateTargetUI() {
    const banner = $('#targetBanner');
    if (!state.targetPos) {
      banner.classList.add('hidden');
      return;
    }
    banner.classList.remove('hidden');
    const dist = state.myPos ? haversine(state.myPos, state.targetPos) : null;
    $('#targetName').textContent = state.targetName;
    $('#targetDist').textContent = '(' + fmtDistSimple(dist) + ')';
    
    const q = new URLSearchParams({
      api: '1', destination: state.targetPos.lat + ',' + state.targetPos.lng, travelmode: 'walking'
    });
    if (state.myPos) q.set('origin', state.myPos.lat + ',' + state.myPos.lng);
    $('#targetNavBtn').href = 'https://www.google.com/maps/dir/?' + q.toString();
  }

  /* ================= 同伴與 SOS 管理 ================= */
  function upsertPeer(m) {
    let p = peers.get(m.id);
    const wasSOS = p ? p.isSOS : false;

    if (!p) {
      p = {
        id: m.id, nickname: m.nickname || '同伴',
        color: hashColor(m.id),
        lat: m.lat, lng: m.lng, isSOS: !!m.isSOS, ts: Date.now(), marker: null
      };
      peers.set(m.id, p);
      addPeerMarker(p);
    } else {
      if (m.nickname && m.nickname !== p.nickname) p.nickname = m.nickname;
      p.lat = m.lat; p.lng = m.lng; p.isSOS = !!m.isSOS; p.ts = Date.now();
      if (p.marker) {
        p.marker.setLatLng([m.lat, m.lng]);
        p.marker.setIcon(iconFor(p.nickname, p.color, false, p.isSOS));
      }
    }

    if (!wasSOS && p.isSOS) {
      toast('🚨 警告：' + p.nickname + ' 發出了 SOS 求救訊號！', 8000);
    }
    renderPeers();
  }

  function removePeer(id) {
    const p = peers.get(id);
    if (!p) return;
    if (p.marker && state.map) state.map.removeLayer(p.marker);
    peers.delete(id);
    renderPeers();
  }

  /* ================= 列表渲染 ================= */
  function navUrl(p) {
    const q = new URLSearchParams({
      api: '1', destination: p.lat + ',' + p.lng, travelmode: 'walking'
    });
    if (state.myPos) q.set('origin', state.myPos.lat + ',' + state.myPos.lng);
    return 'https://www.google.com/maps/dir/?' + q.toString();
  }

  function renderPeers() {
    const el = $('#peerList');
    const scrollTop = el.scrollTop;

    $('#topCount').textContent = peers.size + 1;

    const list = [...peers.values()].map(p => ({
      ...p,
      dist: state.myPos ? haversine(state.myPos, p) : null
    })).sort((a, b) => {
      if (a.isSOS !== b.isSOS) return a.isSOS ? -1 : 1; 
      return (a.dist ?? Infinity) - (b.dist ?? Infinity);
    });

    if (!list.length) {
      el.innerHTML = '<div class="empty">目前只有你一個人 🌱<br>把邀請連結傳給同伴加入吧！<br><small style="color:#666;font-size:14px;">(提示：點擊上方「🔍 找地點」可設定全體集合點)</small></div>';
      return;
    }

    el.innerHTML = list.map(p => `
      <div class="peer ${p.isSOS ? 'sos-active' : ''}" onclick="focusPeer('${p.id}')">
        <span class="pdot" style="background:${p.isSOS ? '#ff1744' : p.color}"></span>
        <div class="pinfo">
          <div class="pname">
            ${esc(p.nickname)}
            ${p.isSOS ? '<span class="sos-tag">SOS 求救中</span>' : ''}
          </div>
          <div class="pmeta">${fmtDistSemantic(p.dist)} · ${ago(p.ts)}</div>
        </div>
        <a class="navbtn" href="${navUrl(p)}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">導航</a>
      </div>`).join('');

    el.scrollTop = scrollTop;
  }

  /* ================= 互動邏輯 ================= */
  $('#panelToggle').addEventListener('click', () => {
    const list = $('#peerList');
    const icon = $('#toggleIcon');
    const isHidden = list.classList.toggle('hidden');
    icon.innerHTML = isHidden ? '▲ 展開' : '▼ 收合';
  });

  window.focusPeer = function (id) {
    const p = peers.get(id);
    if (!p || !state.map) return;
    clearLine();
    setFollowMode(false); 
    const target = [p.lat, p.lng];

    if (state.myPos) {
      const mine = [state.myPos.lat, state.myPos.lng];
      const d = haversine(state.myPos, p);
      state.line = L.polyline([mine, target], {
        color: p.isSOS ? '#ff1744' : p.color, weight: 5, dashArray: '8 10', opacity: 1
      }).addTo(state.map)
        .bindTooltip('距離 ' + fmtDistSemantic(d), {
          permanent: true, direction: 'center', className: 'lineTip'
        }).openTooltip();
      state.map.fitBounds(L.latLngBounds([mine, target]).pad(0.35));
    } else {
      state.map.setView(target, 17);
    }
    toast('已標示與「' + p.nickname + '」的距離');
  };

  function setFollowMode(enable) {
    state.isFollowing = enable;
    const btn = $('#locBtn');
    const txt = $('#locTxt');
    if (enable) {
      btn.classList.add('following');
      txt.textContent = '跟隨中';
      if (state.myPos && state.map) {
        state.map.setView([state.myPos.lat, state.myPos.lng], 17);
      }
      toast('🎯 已開啟跟隨視角');
    } else {
      btn.classList.remove('following');
      txt.textContent = '定位';
    }
  }

  window.toggleFollowMe = function () {
    if (!state.myPos || !state.map) return toast('尚未取得定位');
    clearLine();
    setFollowMode(!state.isFollowing);
  };

  function toggleSOS() {
    state.isSOS = !state.isSOS;
    const btn = $('#sosBtn');
    if (state.isSOS) {
      btn.classList.add('active');
      toast('🚨 SOS 求救訊號已發送給所有同伴！', 5000);
    } else {
      btn.classList.remove('active');
      toast('已取消 SOS 求救狀態');
    }
    updateMeMarker();
    sendPos();
  }

  /* ================= MQTT 即時同步 ================= */
  function send(type, extra) {
    if (!state.client || !state.client.connected) return;
    const msg = Object.assign({
      type: type, id: state.id, nickname: state.nickname, ts: Date.now()
    }, extra || {});
    state.client.publish(state.topic, JSON.stringify(msg), { qos: 0 });
  }

  function sendPos() {
    if (!state.myPos) return;
    send('pos', { lat: state.myPos.lat, lng: state.myPos.lng, acc: state.myPos.acc, isSOS: state.isSOS });
  }

  function setNet(on) { $('#netDot').classList.toggle('on', !!on); }

  function connectMQTT() {
    if (typeof mqtt === 'undefined') {
      toast('網路載入失敗，請重新整理');
      return;
    }
    state.client = mqtt.connect(BROKER, {
      clientId: 'geoact_' + state.id,
      clean: true, keepalive: 30, reconnectPeriod: 3000, connectTimeout: 10000
    });

    state.client.on('connect', () => {
      setNet(true);
      state.client.subscribe(state.topic, { qos: 0 }, err => {
        if (err) return;
        send('hello');        
        sendPos();            
      });
    });

    state.client.on('message', (topic, buf) => {
      let m;
      try { m = JSON.parse(buf.toString()); } catch (e) { return; }
      if (!m || !m.id) return;

      if (m.id !== state.id) {
        if (m.type === 'hello') { sendPos(); return; }          
        if (m.type === 'bye')   { removePeer(m.id); return; }   
        if (m.type === 'pos' && typeof m.lat === 'number' && typeof m.lng === 'number') {
          upsertPeer(m);
        }
      }
      
      if (m.type === 'set_target' && typeof m.lat === 'number') {
        setTargetPos(m.lat, m.lng, m.name, false);
      }
      if (m.type === 'clear_target') {
        clearTargetPos(false);
      }
    });

    state.client.on('reconnect', () => setNet(false));
    state.client.on('close',     () => setNet(false));
    state.client.on('error',     () => setNet(false));
  }

  /* ================= GPS 定位 ================= */
  function hideLoading() {
    const el = $('#loading');
    if (el) el.remove();
  }

  function onPos(pos) {
    const c = pos.coords;
    state.myPos = { lat: c.latitude, lng: c.longitude, acc: c.accuracy };
    hideLoading();

    if (!state.map) ensureMap([state.myPos.lat, state.myPos.lng]);
    updateMeMarker();

    if (!state.firstFix) {
      state.firstFix = true;
      setFollowMode(true); 
    } else if (state.isFollowing && state.map) {
      state.map.panTo([state.myPos.lat, state.myPos.lng]);
    }

    updateTargetUI();
    sendPos();
    renderPeers();
  }

  function onPosErr(err) {
    const map = {
      1: '定位權限被拒絕。請到手機設定允許定位後重整。',
      2: '目前無法取得定位訊號，請確認 GPS 已開啟。',
      3: '取得定位逾時，請到空曠處再試一次。'
    };
    const el = $('#loading');
    if (el) {
      el.innerHTML = '<b style="color:#ff5252;font-size:20px;">定位失敗</b><br>' + (map[err.code] || err.message);
    }
    toast(map[err.code] || '定位失敗');
  }

  function startGeo() {
    if (!navigator.geolocation) {
      toast('此瀏覽器不支援 GPS 定位');
      return;
    }
    state.watchId = navigator.geolocation.watchPosition(onPos, onPosErr, {
      enableHighAccuracy: true, maximumAge: 3000, timeout: 20000
    });
  }

  /* ================= 加入 / 離開 ================= */
  function join() {
    const code = $('#codeInput').value.trim();
    const nick = $('#nickInput').value.trim();

    if (!code) { toast('請輸入活動代號'); $('#codeInput').focus(); return; }
    if (!nick) { toast('請輸入你的暱稱'); $('#nickInput').focus(); return; }

    state.code = code;
    state.nickname = nick;
    state.topic = TOPIC_PREFIX + code.replace(/[^\w\u4e00-\u9fa5-]/g, '_');
    state.color = hashColor(state.id);

    $('#topCode').textContent = code;
    $('#joinScreen').classList.add('hidden');
    $('#mapScreen').classList.remove('hidden');

    state.joined = true;
    startGeo();
    connectMQTT();

    setTimeout(() => {
      if (!state.map && state.joined) {
        ensureMap([25.0478, 121.5170]);
        state.map.setView([25.0478, 121.5170], 14);
        toast('尚未取得 GPS，地圖先以預設位置顯示');
      }
    }, 5000);

    try {
      const u = new URL(location.href);
      u.searchParams.set('code', code);
      history.replaceState(null, '', u);
    } catch (e) {}
  }

  function leave() {
    if (!confirm('確定要離開這個活動嗎？')) return;
    send('bye');
    setTimeout(() => {
      if (state.client) state.client.end(true);
      if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
      location.href = location.pathname;
    }, 250);
  }

  function copyInvite() {
    const url = location.origin + location.pathname + '?code=' + encodeURIComponent(state.code);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => toast('✅ 邀請連結已複製！'))
        .catch(() => toast(url, 6000));
    } else {
      toast(url, 6000);
    }
  }

  /* ================= 事件綁定 ================= */
  $('#joinBtn').addEventListener('click', join);
  $('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#nickInput').focus(); });
  $('#nickInput').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  $('#copyBtn').addEventListener('click', copyInvite);
  $('#leaveBtn').addEventListener('click', leave);
  $('#locBtn').addEventListener('click', window.toggleFollowMe);
  $('#sosBtn').addEventListener('click', toggleSOS);
  $('#clearTargetBtn').addEventListener('click', () => clearTargetPos(true));
  
  /* 搜尋相關事件 */
  $('#searchToggleBtn').addEventListener('click', () => {
    $('#searchModal').classList.remove('hidden');
    $('#searchInput').focus();
  });
  $('#closeSearchModal').addEventListener('click', () => {
    $('#searchModal').classList.add('hidden');
  });
  $('#searchSubmitBtn').addEventListener('click', () => {
    searchLocation($('#searchInput').value);
  });
  $('#searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchLocation($('#searchInput').value);
  });

  window.addEventListener('beforeunload', () => { if (state.joined) send('bye'); });

  /* 由網址預填活動代號 */
  (function prefill() {
    const c = new URLSearchParams(location.search).get('code');
    if (c) $('#codeInput').value = c;
    $('#nickInput').focus();
  })();

  /* 週期任務 */
  setInterval(() => { sendPos(); }, PING_MS);        
  setInterval(() => { renderPeers(); }, 10000); 

})();
</script>
</body>
</html>
