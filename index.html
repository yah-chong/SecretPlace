<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden;background:#000;}
  .screen{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---------- 加入畫面 ---------- */
  #joinScreen{
    display:flex;align-items:center;justify-content:center;padding:16px;
    background:#000; color:#fff; overflow-y:auto;
  }
  .card{
    width:100%;max-width:460px;background:#111;
    border:2px solid #555;border-radius:16px;padding:28px 20px;
  }
  .card h1{margin:0 0 12px;font-size:32px;letter-spacing:1px;color:#fff;}
  .sub{margin:0 0 22px;font-size:18px;color:#eee;line-height:1.6;font-weight:500;}
  label{display:block;font-size:19px;color:#ffeb3b;margin:18px 0 8px;font-weight:bold;letter-spacing:1px}
  input{
    width:100%;padding:16px;border-radius:12px;border:2.5px solid #666;
    background:#1c1c1c;color:#fff;font-size:22px;font-weight:bold;outline:none;transition:.2s;
  }
  input:focus{border-color:#ffeb3b;background:#000;}
  input::placeholder{color:#999;font-weight:normal;}
  button.primary{
    width:100%;margin-top:28px;padding:18px;border:0;border-radius:12px;font-size:24px;font-weight:900;
    background:#ffeb3b;color:#000;cursor:pointer;
    box-shadow:0 6px 15px rgba(255,235,59,.35);transition:.15s;
  }
  button.primary:active{transform:scale(.97);background:#fbc02d;}
  .hint{font-size:16px;color:#bbb;text-align:center;margin:18px 0 0;line-height:1.6}

  /* ---------- 地圖畫面 ---------- */
  #mapScreen{background:#000}
  #map{position:absolute;inset:0;background:#000}

  /* 頂部資訊列 */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    pointer-events:none;background:linear-gradient(to bottom, rgba(0,0,0,0.88) 65%, rgba(0,0,0,0));
  }
  #topbar > * { pointer-events:auto; }

  .chip{
    background:#000;color:#fff;border-radius:8px;padding:8px 12px;font-size:16px;font-weight:bold;
    display:flex;gap:6px;align-items:center;border:2px solid #666;white-space:nowrap; 
    max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .lbl{color:#ccc;}
  .chip b{color:#ffeb3b;font-size:17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  
  #myStatusChip {
    background:#1b2e1e; border-color:#00e676; color:#fff; max-width:92vw; cursor:pointer;
  }
  #myStatusChip span { color:#ffeb3b; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #netDot{width:11px;height:11px;border-radius:50%;background:#ff3d00;transition:.3s;flex-shrink:0;}
  #netDot.on{background:#00e676;box-shadow:0 0 8px #00e676}

  /* 🔍 右側控制按鈕組 */
  .control-group {
    position:absolute;right:12px;top:42%;transform:translateY(-50%);z-index:1000;
    display:flex;flex-direction:column;gap:8px; align-items:flex-end;
  }
  
  .ctrl-btn {
    width:58px;height:58px;border-radius:50%;border:3px solid #fff;
    background:#000;color:#fff;font-size:19px;font-weight:bold;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;
    flex-direction:column;line-height:1.15;
  }
  .ctrl-btn:active{transform:scale(.94)}
  
  #sosBtn { background:#d32f2f; border-color:#ff5252; color:#fff; }
  #sosBtn.active { background:#ff1744; border-color:#fff; animation: alertFlash .5s infinite alternate; }
  #statusToggleBtn { background:#00e676; color:#000; border-color:#fff; }
  #itineraryToggleBtn { background:#ff9100; color:#000; border-color:#fff; }
  #locBtn.following { background:#2979ff; color:#fff; border-color:#fff; }
  #searchToggleBtn { background:#ffeb3b; color:#000; border-color:#fff; }

  #copyBtn {
    width: 58px; height: 38px; border-radius: 8px; border: 2px solid #999;
    background: #111; color: #fff; font-size: 13px; font-weight: bold;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; transition: .15s;
  }
  #copyBtn:active { transform: scale(0.94); background: #333; }

  #leaveBtn {
    width: 58px; height: 38px; border-radius: 8px; border: 2.5px solid #ff5252;
    background: #1a0505; color: #ff5252; font-size: 13px; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    transition: .15s; margin-bottom: 4px;
  }
  #leaveBtn:active { transform: scale(0.94); background: #3a0d0d; }

  /* 🔍 滿版無多餘外框彈出視窗 */
  .modal-backdrop {
    position: absolute; inset: 0; z-index: 2000; background: #0a0a0a;
    display: flex; flex-direction: column;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    padding-top: calc(12px + env(safe-area-inset-top));
    overflow-y: auto;
  }
  .modal-card {
    background: transparent; border: none; border-radius: 0; padding: 0;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 560px; width: 100%; height: 100%; margin: 0 auto;
  }
  .search-input-row { display: flex; gap: 8px; }
  .search-input-row input {
    font-size: 19px; padding: 14px; border-radius: 10px;
    border: 2.5px solid #777; background: #1c1c1c; color: #fff; flex: 1;
  }
  .search-input-row input:focus { border-color: #ffeb3b; background: #000; }
  .search-input-row button {
    background: #ffeb3b; color: #000; border: none; border-radius: 10px;
    padding: 0 20px; font-weight: 900; font-size: 18px; cursor: pointer; white-space: nowrap;
  }

  #searchResults, #itinerarySearchResults {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 10px; margin-top: 2px;
  }
  #itinerarySearchResults { max-height: 36vh; }

  .search-item {
    background: #1a1a1a; border-bottom: 2px solid #333; padding: 14px 12px; border-radius: 10px;
    color: #fff; cursor: pointer; transition: .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .search-item:active { background: #2c2c2c; }
  .search-item-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .search-item-title {
    color: #ffeb3b; font-size: 19px; font-weight: 900; line-height: 1.35; word-break: break-word;
  }
  .search-item-sub {
    color: #ccc; font-size: 15px; line-height: 1.4; word-break: break-word;
  }
  .search-item-dist {
    background: #003314; color: #00e676; font-size: 15px; font-weight: 900;
    padding: 4px 10px; border-radius: 6px; white-space: nowrap; border: 1.5px solid #00e676; flex-shrink: 0;
  }

  /* 📅 行程清單卡片樣式 */
  .itinerary-list-container {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 10px;
  }
  .itinerary-item {
    background: #181818; border-left: 6px solid #555; border-radius: 10px;
    padding: 14px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .itinerary-item.active-stop {
    border-left-color: #ff9100; background: #261b08;
  }
  .itinerary-title {
    color: #ffffff; font-size: 21px; font-weight: 900; line-height: 1.4;
    word-break: break-word;
  }
  .active-badge {
    display: inline-block; background: #ff9100; color: #000; font-size: 14px; font-weight: 900;
    padding: 2px 8px; border-radius: 6px; vertical-align: middle; margin-left: 6px;
  }
  .itinerary-bottom-row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .itinerary-dist {
    color: #00e676; font-size: 17px; font-weight: 900;
  }
  .itinerary-actions {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .itinerary-move-btn {
    background: #2b2b2b; color: #ffeb3b; border: 1.5px solid #666;
    padding: 8px 11px; border-radius: 8px; font-size: 16px; font-weight: 900;
    cursor: pointer; line-height: 1;
  }
  .itinerary-move-btn:disabled {
    opacity: 0.28; color: #888; border-color: #444; cursor: not-allowed;
  }
  .itinerary-move-btn:not(:disabled):active { background: #444; }

  .itinerary-set-btn {
    background: #00e676; color: #000; border: none; padding: 9px 14px; border-radius: 8px;
    font-size: 16px; font-weight: 900; cursor: pointer; white-space: nowrap;
  }
  .itinerary-set-btn:active { background: #00c853; transform: scale(0.96); }

  .itinerary-del-btn {
    background: #3a1212; color: #ff6e6e; border: 1.5px solid #ff5252; padding: 8px 11px; border-radius: 8px;
    font-size: 15px; font-weight: 900; cursor: pointer; white-space: nowrap;
  }
  .itinerary-del-btn:active { background: #5a1a1a; }

  /* 💬 快速狀態按鈕與短語音留言樣式 */
  .quick-status-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #555;
    background: #1c1c1c; color: #fff; font-size: 19px; font-weight: 900;
    text-align: left; cursor: pointer; transition: .15s; display: flex; align-items: center; gap: 10px;
  }
  .quick-status-btn:active { background: #333; border-color: #00e676; transform: scale(0.98); }
  .quick-status-btn.clear-btn { border-color: #777; color: #eee; justify-content: center; font-size: 17px; }

  .voice-box {
    background: #161616; border: 2px dashed #00e676; border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; margin-top: 2px;
  }
  .voice-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: #ff1744; color: #fff; font-size: 20px; font-weight: 900;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(255,23,68,0.4); transition: .15s;
  }
  .voice-btn.recording { background: #ffeb3b; color: #000; animation: alertFlash 0.6s infinite alternate; }
  .custom-msg-row { display: flex; gap: 8px; }
  .custom-msg-row input { font-size: 18px; padding: 13px; border-radius: 10px; border: 2px solid #666; background: #222; color: #fff; flex: 1; }
  .custom-msg-row button {
    background: #00e676; color: #000; border: none; border-radius: 10px;
    padding: 0 18px; font-weight: 900; font-size: 18px; cursor: pointer; white-space: nowrap;
  }

  .close-modal-btn {
    background: #2b2b2b; color: #fff; border: 2px solid #777; padding: 15px; border-radius: 12px;
    font-weight: 900; font-size: 19px; cursor: pointer; text-align: center; margin-top: auto;
  }
  .close-modal-btn:active { background: #444; }

  /* 🎯 集合點膠囊橫條 (雙行完美排版，避免被按鈕遮蔽) */
  #targetBanner {
    position: absolute; left: 12px; right: 12px; bottom: 78px; z-index: 1005;
    background: rgba(12, 12, 12, 0.96); border: 2.5px solid #ff9100; border-radius: 16px;
    padding: 10px 12px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.9); cursor: pointer;
  }
  #targetBanner .t-info { 
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;
  }
  #targetBanner .t-title-row {
    font-size: 17px; font-weight: 900; color: #ffab40; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #targetBanner .t-walk-row {
    font-size: 15px; font-weight: 900; color: #00e676; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  
  .target-banner-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  #targetBanner .t-btn {
    background: #00e676; color: #000; border: none; padding: 9px 14px; border-radius: 10px;
    font-weight: 900; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  #targetBanner .t-clear {
    background: #ff1744; color: #fff; border: none; padding: 9px 12px;
    border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; white-space: nowrap;
  }

  /* 底部面板 */
  #panel{
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: #111;
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    border-top: 3px solid #555;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.7);
  }
  .panel-head{
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; font-weight: 900; color: #eee; padding: 4px 4px 6px;
    cursor: pointer; user-select: none;
  }
  .panel-head:active{opacity:0.7;}
  
  #peerList{
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: 36vh;
  }
  
  .peer{
    display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px;
    background: #1e1e1e; border: 2px solid #444; margin-bottom: 8px; cursor: pointer; transition: .15s;
  }
  .peer.sos-active { border-color: #ff1744; background: #3a0d0d; animation: alertFlash 1s infinite alternate; }
  .peer.offline { opacity: 0.75; border-color: #666; background: #161616; }
  .peer:active{ background: #333; border-color: #ffeb3b; }
  .pdot{ width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto; border: 2px solid #fff; }
  .pinfo{ flex: 1; min-width: 0; }
  
  .pname{ color: #fff; font-size: 20px; font-weight: 900; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .sos-tag { background: #ff1744; color: #fff; font-size: 13px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  .offline-tag { background: #ff9100; color: #000; font-size: 13px; padding: 2px 6px; border-radius: 4px; font-weight: 900; }
  .bat-low-tag { background: #d50000; color: #fff; font-size: 13px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  .bat-ok-tag { background: #2c2c2c; color: #00e676; font-size: 13px; padding: 2px 6px; border-radius: 4px; font-weight: bold; border: 1px solid #555; }
  
  .pstatus-bubble {
    display: inline-block; background: #ffeb3b; color: #000; font-size: 15px; font-weight: 900;
    padding: 4px 10px; border-radius: 8px; margin-top: 6px; line-height: 1.3;
  }

  .pmeta{ color: #ccc; font-size: 14px; font-weight: bold; margin-top: 5px; line-height: 1.4; }
  .pwalk{ color: #00e676; font-size: 15px; font-weight: 900; margin-top: 4px; }
  .navbtn{
    background: #00e676; color: #000; text-decoration: none; font-size: 16px; font-weight: 900;
    padding: 11px 14px; border-radius: 8px; flex: 0 0 auto; border: 2px solid #000;
  }
  
  .empty{ color: #ddd; font-size: 17px; font-weight: bold; padding: 14px 10px; text-align: center; line-height: 1.6; }

  /* 地圖標記樣式 */
  .pin{position:absolute;left:0;top:0}
  .pin .dot{
    position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;
    border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.6);
  }
  .pin .name{
    position:absolute;left:0;top:18px;transform:translateX(-50%);
    font-size:16px;font-weight:900;color:#000;background:#fff;
    padding:3px 10px;border-radius:8px;white-space:nowrap;border:2px solid #000;
  }
  .pin .pin-status{
    position:absolute;left:0;top:50px;transform:translateX(-50%);
    font-size:14px;font-weight:900;color:#000;background:#ffeb3b;
    padding:2px 8px;border-radius:6px;white-space:nowrap;border:2px solid #000;
    box-shadow:0 3px 8px rgba(0,0,0,0.6); max-width:200px; overflow:hidden; text-overflow:ellipsis;
  }
  .pin.me .dot{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 12px rgba(0,230,118,.5)}
  .pin.sos .dot { background:#ff1744!important; animation: sosPulse 0.8s infinite alternate; }
  .pin.sos .name { background:#ff1744; color:#fff; border-color:#fff; }
  .pin.offline .dot { background:#888!important; border-color:#ccc; }
  .pin.offline .name { background:#333; color:#ffcc80; border-color:#ff9100; }

  .target-pin {
    font-size: 34px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    transform: translate(-50%, -100%);
  }

  .leaflet-tooltip.lineTip{
    background:#000;color:#ffeb3b;border:2px solid #fff;font-size:16px;font-weight:900;
    padding:6px 12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.7);
    text-align:center;line-height:1.4;
  }
  .leaflet-tooltip.lineTip::before{display:none}

  #loading{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;
    background:#000;color:#fff;padding:20px 30px;border-radius:12px;
    font-size:19px;font-weight:bold;text-align:center;line-height:1.8;border:3px solid #666;
    max-width:88vw;
  }
  #toast{
    position:fixed;left:50%;bottom:135px;transform:translate(-50%,20px);z-index:3000;
    background:#ffeb3b;color:#000;padding:15px 22px;border-radius:10px;font-weight:900;
    font-size:18px;opacity:0;transition:.25s;pointer-events:none;
    border:3px solid #000;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes sosPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0px rgba(255,23,68,0.8); }
    100% { transform: scale(1.4); box-shadow: 0 0 0 20px rgba(255,23,68,0); }
  }
  @keyframes alertFlash {
    0% { opacity: 1; }
    100% { opacity: 0.4; }
  }
</style>
</head>

      <button class="quick-status-btn" data-status="🍔 我在買飲料/休息中">🍔 我在買飲料 / 休息中</button>
      <button class="quick-status-btn" data-status="🚻 上廁所中，稍等">🚻 上廁所中，稍等</button>

      <div class="voice-box">

      <button class="quick-status-btn clear-btn" data-status="">✅ 清除狀態（恢復正常顯示）</button>

  <!-- 🎯 集合點膠囊橫條 -->

  <!-- 右側控制按鈕組 -->
  <div class="control-group">

    <button id="statusToggleBtn" class="ctrl-btn" title="設定狀態或短語音留言">💬<span style="font-size:11px;">狀態</span></button>

  <div id="loading">正在取得定位…<br><span style="font-size:16px;color:#ccc">請允許瀏覽器定位權限</span></div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  'use strict';

  const COLORS = ['#ff5252','#448aff','#ffb300','#00e676','#aa00ff','#00bcd4','#ff6d00','#3f51b5','#e91e63','#8bc34a'];
  const BROKER  = 'wss://broker.emqx.io:8084/mqtt';   
  const TOPIC_PREFIX = 'geoact/v1/';
  const PING_MS  = 15 * 1000;
  const OFFLINE_MS = 60 * 1000;

  const state = {
    id: 'u' + Math.random().toString(36).slice(2, 10),
    code: '', nickname: '', color: COLORS[0], topic: '', targetTopic: '', itineraryTopic: '',
    myPos: null, map: null, meMarker: null, line: null,
    client: null, watchId: null, firstFix: false, joined: false,
    isSOS: false,
    isFollowing: false, 
    targetPos: null,    
    targetName: '集合點',
    targetMarker: null,
    wakeLock: null,
    batteryLevel: null,
    isCharging: false,
    myStatus: '',
    itinerary: [],
    itineraryUpdatedAt: 0 // 時間戳確保最新清單優先
  };
  const peers = new Map();   

  const $ = s => document.querySelector(s);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg, ms) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), ms || 3500);
  }
  function hashColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function haversine(a, b) {                         
    const R = 6371000, rad = d => d * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 +
              Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  function fmtDistSimple(m) {
    if (m == null) return '未知距離';
    if (m < 1000) return Math.round(m) + ' 公尺';
    return (m / 1000).toFixed(1) + ' 公里';
  }

  function fmtTimeEstimate(m) {
    if (m == null) return '計算中...';
    const distStr = fmtDistSimple(m);
    if (m > 2000) {
      const driveMins = Math.max(1, Math.round(m / 500));
      return `🚗 開車約 ${driveMins} 分鐘（${distStr}）`;
    } else {
      const walkMins = Math.max(1, Math.round(m / 75));
      if (walkMins >= 60) {
        const hrs = Math.floor(walkMins / 60);
        const rem = walkMins % 60;
        return `🚶 步行約 ${hrs} 小時 ${rem > 0 ? rem + ' 分鐘' : ''}（${distStr}）`;
      }
      return `🚶 步行約 ${walkMins} 分鐘（${distStr}）`;
    }
  }

  function ago(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 10) return '剛剛';
    if (s < 60) return s + ' 秒前';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' 分鐘前';
    return Math.floor(m / 60) + ' 小時前';
  }

  /* ================= 本地快取備援機制 ================= */
  function saveLocalCache() {
    if (!state.code) return;
    try {
      const cache = {
        itinerary: state.itinerary,
        itineraryUpdatedAt: state.itineraryUpdatedAt,
        targetPos: state.targetPos,
        targetName: state.targetName
      };
      localStorage.setItem('geoact_cache_' + state.code, JSON.stringify(cache));
    } catch (e) {}
  }

  function loadLocalCache() {
    if (!state.code) return;
    try {
      const raw = localStorage.getItem('geoact_cache_' + state.code);
      if (!raw) return;
      const cache = JSON.parse(raw);
      if (Array.isArray(cache.itinerary) && cache.itinerary.length > 0) {
        state.itinerary = cache.itinerary;
        state.itineraryUpdatedAt = cache.itineraryUpdatedAt || Date.now();
        renderItineraryList();
      }
      if (cache.targetPos && typeof cache.targetPos.lat === 'number') {
        setTargetPos(cache.targetPos.lat, cache.targetPos.lng, cache.targetName || '集合點', false);
      }
    } catch (e) {}
  }

  /* ================= 📅 今日行程管理、順序調整與一鍵切換 ================= */
  function renderItineraryList() {
    const container = $('#itineraryListContainer');
    if (!state.itinerary.length) {
      container.innerHTML = '<div style="color:#ccc; font-size:18px; text-align:center; padding:30px 10px;">目前尚無行程站點，請點擊上方「＋ 新增站點」！</div>';
      return;
    }

    container.innerHTML = state.itinerary.map((stop, idx) => {
      const isActive = state.targetPos && Math.abs(state.targetPos.lat - stop.lat) < 0.0001 && Math.abs(state.targetPos.lng - stop.lng) < 0.0001;
      let distText = '距離計算中...';
      if (state.myPos) {
        const d = haversine(state.myPos, { lat: stop.lat, lng: stop.lng });
        distText = `📍 距離你 ${fmtDistSimple(d)}`;
      }

      const isFirst = idx === 0;
      const isLast = idx === state.itinerary.length - 1;

      return `
        <div class="itinerary-item ${isActive ? 'active-stop' : ''}">
          <div class="itinerary-title">
            第 ${idx + 1} 站：${esc(stop.name)}${isActive ? '<span class="active-badge">集合中</span>' : ''}
          </div>
          <div class="itinerary-bottom-row">
            <div class="itinerary-dist">${distText}</div>
            <div class="itinerary-actions">
              <button class="itinerary-move-btn" ${isFirst ? 'disabled' : ''} onclick="window.moveItineraryStop(${idx}, -1)" title="往上移一站">⬆️</button>
              <button class="itinerary-move-btn" ${isLast ? 'disabled' : ''} onclick="window.moveItineraryStop(${idx}, 1)" title="往下移一站">⬇️</button>
              <button class="itinerary-set-btn" onclick="window.selectItineraryStop(${idx})">設為集合點</button>
              <button class="itinerary-del-btn" onclick="window.removeItineraryStop(${idx})">刪除</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.moveItineraryStop = function(idx, direction) {
    const targetIdx = idx + direction;
    if (targetIdx < 0 || targetIdx >= state.itinerary.length) return;
    
    const temp = state.itinerary[idx];
    state.itinerary[idx] = state.itinerary[targetIdx];
    state.itinerary[targetIdx] = temp;
    state.itineraryUpdatedAt = Date.now();

    saveLocalCache();
    broadcastItinerary(true);
    renderItineraryList();
    toast(`✅ 已調整為「第 ${targetIdx + 1} 站」`);
  };

  window.selectItineraryStop = function(idx) {
    const stop = state.itinerary[idx];
    if (!stop) return;
    setTargetPos(stop.lat, stop.lng, `第 ${idx + 1} 站：${stop.name}`, true);
    $('#itineraryModal').classList.add('hidden');
    focusTarget();
  };

  window.removeItineraryStop = function(idx) {
    state.itinerary.splice(idx, 1);
    state.itineraryUpdatedAt = Date.now();
    saveLocalCache();
    broadcastItinerary(true);
    renderItineraryList();
    toast('已移除該行程站點');
  };

  function addItineraryStop(name, lat, lng) {
    state.itinerary.push({ id: 's' + Math.random().toString(36).slice(2, 8), name, lat, lng });
    state.itineraryUpdatedAt = Date.now();
    saveLocalCache();
    broadcastItinerary(true);
    renderItineraryList();
    if (state.itinerary.length === 1 && !state.targetPos) {
      setTargetPos(lat, lng, `第 1 站：${name}`, true);
    }
    toast(`✅ 已加入行程：${name}`);
  }

  function broadcastItinerary(useRetain) {
    if (!state.client || !state.client.connected) return;
    const msg = JSON.stringify({
      type: 'sync_itinerary',
      list: state.itinerary,
      updatedAt: state.itineraryUpdatedAt,
      senderId: state.id
    });
    state.client.publish(state.itineraryTopic, msg, { qos: 0, retain: !!useRetain });
  }

  async function searchItineraryLocation(query) {
    if (!query.trim()) return toast('請輸入要搜尋的景點名稱');
    toast('正在檢索行程地點...');
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`, {
        headers: { 'Accept-Language': 'zh-Hant' }
      });
      const data = await res.json();
      const resultsEl = $('#itinerarySearchResults');
      resultsEl.innerHTML = '';

      if (!data.length) {
        resultsEl.innerHTML = '<div style="color:#ccc; font-size:16px; text-align:center; padding:12px;">找不到相關地點</div>';
        return;
      }

      data.forEach(item => {
        const parts = item.display_name.split(',');
        const mainTitle = parts[0];
        const subTitle = parts.slice(1, 4).join(', ');
        const itemLat = parseFloat(item.lat);
        const itemLng = parseFloat(item.lon);

        let distStr = '距離未知';
        if (state.myPos) {
          const distM = haversine(state.myPos, { lat: itemLat, lng: itemLng });
          distStr = fmtDistSimple(distM);
        }

        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `
          <div class="search-item-top">
            <div class="search-item-title">📍 ${esc(mainTitle)}</div>
            <span class="search-item-dist">${distStr}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div class="search-item-sub" style="flex:1;">${esc(subTitle)}</div>
            <span style="color:#ff9100; font-size:16px; font-weight:900; white-space:nowrap;">＋ 加入行程</span>
          </div>
        `;
        div.addEventListener('click', () => {
          addItineraryStop(mainTitle, itemLat, itemLng);
          $('#itinerarySearchInput').value = '';
          resultsEl.innerHTML = '';
          $('#addStopBox').classList.add('hidden');
        });
        resultsEl.appendChild(div);
      });
    } catch (e) {
      toast('搜尋發生錯誤，請檢查網路連線');
    }
  }

  /* ================= 💬 個人狀態與短語音留言管理 ================= */
  function setMyStatus(text) {
    state.myStatus = (text || '').trim();
    const chip = $('#myStatusChip');
    const txtEl = $('#myStatusText');
    if (state.myStatus) {
      chip.classList.remove('hidden');
      txtEl.textContent = state.myStatus;
      toast('📢 已更新狀態：' + state.myStatus);
    } else {
      chip.classList.add('hidden');
      txtEl.textContent = '';
      toast('✅ 已清除目前狀態');
    }
    updateMeMarker();
    sendPos();
  }

  function setupVoiceRecognition() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = $('#voiceRecordBtn');
    const input = $('#customStatusInput');

    if (!SpeechRec) {
      btn.style.display = 'none';
      return;
    }

    const recognition = new SpeechRec();
    recognition.lang = 'zh-TW';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let isRecording = false;

    btn.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
        return;
      }
      try { recognition.start(); } catch (e) {}
    });

    recognition.onstart = () => {
      isRecording = true;
      btn.classList.add('recording');
      btn.innerHTML = '🔴 正在聆聽中...（請說話）';
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      if (transcript) {
        input.value = transcript;
        setMyStatus('🎙️ ' + transcript);
        $('#statusModal').classList.add('hidden');
      }
    };

    recognition.onerror = () => {
      toast('語音辨識未成功，請再試一次或直接輸入文字');
    };

    recognition.onend = () => {
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️ 點擊開始說話';
    };
  }

  /* ================= 🔋 手機電池電量監控 ================= */
  async function initBatteryMonitor() {
    if (!('getBattery' in navigator)) return;
    try {
      const bat = await navigator.getBattery();
      const updateBat = () => {
        const oldLvl = state.batteryLevel;
        state.batteryLevel = Math.round(bat.level * 100);
        state.isCharging = bat.charging;
        
        if (state.batteryLevel <= 20 && !state.isCharging && (oldLvl === null || oldLvl > 20)) {
          toast(`🪫 您的手機電量低於 ${state.batteryLevel}%，已通知同伴！`, 5000);
          sendPos();
        }
      };
      updateBat();
      bat.addEventListener('levelchange', updateBat);
      bat.addEventListener('chargingchange', updateBat);
    } catch (e) {}
  }

  /* ================= 💡 螢幕恆亮控制 ================= */
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      if (state.wakeLock !== null) return;
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
    } catch (err) {}
  }

  document.addEventListener('visibilitychange', async () => {
    if (state.joined && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  /* ================= 地圖初始化與控制 ================= */
  function ensureMap(latlng) {
    if (state.map) return;
    state.map = L.map('map', { zoomControl: false, attributionControl: true }).setView(latlng, 17);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(state.map);

    state.map.on('contextmenu', function(e) {
      setTargetPos(e.latlng.lat, e.latlng.lng, '自訂地點', true);
    });

    state.map.on('dragstart', function() {
      if (state.isFollowing) setFollowMode(false);
    });

    peers.forEach(p => addPeerMarker(p));     
    if (state.targetPos && !state.targetMarker) {
      setTargetPos(state.targetPos.lat, state.targetPos.lng, state.targetName, false);
    }
  }

  function iconFor(nickname, color, isMe, isSOS, isOffline, statusText) {
    const sosClass = isSOS ? ' sos' : '';
    const meClass = isMe ? ' me' : '';
    const offClass = (!isMe && isOffline) ? ' offline' : '';
    let prefix = '';
    if (isSOS) prefix = '🆘 ';
    else if (!isMe && isOffline) prefix = '⚠️ ';

    const statusHtml = statusText 
      ? `<div class="pin-status">${esc(statusText)}</div>` 
      : '';

    return L.divIcon({
      className: '',
      html:
        '<div class="pin' + meClass + sosClass + offClass + '">' +
          '<div class="dot" style="background:' + (isSOS ? '#ff1744' : color) + '"></div>' +
          '<div class="name">' + prefix + esc(nickname) + '</div>' +
          statusHtml +
        '</div>',
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
  }

  function updateMeMarker() {
    if (!state.map || !state.myPos) return;
    const ll = [state.myPos.lat, state.myPos.lng];
    if (!state.meMarker) {
      state.meMarker = L.marker(ll, {
        icon: iconFor(state.nickname, '#00e676', true, state.isSOS, false, state.myStatus),
        zIndexOffset: 1000,
        interactive: false
      }).addTo(state.map);
    } else {
      state.meMarker.setLatLng(ll);
      state.meMarker.setIcon(iconFor(state.nickname, '#00e676', true, state.isSOS, false, state.myStatus));
    }
  }

  function addPeerMarker(p) {
    if (!state.map || p.marker) return;
    const isOffline = (Date.now() - p.ts) > OFFLINE_MS;
    p.marker = L.marker([p.lat, p.lng], { icon: iconFor(p.nickname, p.color, false, p.isSOS, isOffline, p.status) })
      .addTo(state.map)
      .on('click', () => focusPeer(p.id));
  }

  function clearLine() {
    if (state.line && state.map) { state.map.removeLayer(state.line); }
    state.line = null;
  }

  /* ================= 搜尋地點設定集合點 ================= */
  async function searchLocation(query) {
    if (!query.trim()) return toast('請輸入要搜尋的地點名稱');
    toast('正在檢索地點...');
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=10`, {
        headers: { 'Accept-Language': 'zh-Hant' }
      });
      const data = await res.json();
      const resultsEl = $('#searchResults');
      resultsEl.innerHTML = '';

      if (!data.length) {
        resultsEl.innerHTML = '<div style="color:#ccc; font-size:17px; text-align:center; padding:16px;">找不到相關地點，請嘗試輸入更精確關鍵字</div>';
        return;
      }

      data.forEach(item => {
        const parts = item.display_name.split(',');
        const mainTitle = parts[0];
        const subTitle = parts.slice(1, 4).join(', ');
        const itemLat = parseFloat(item.lat);
        const itemLng = parseFloat(item.lon);

        let distStr = '距離未知';
        if (state.myPos) {
          const distM = haversine(state.myPos, { lat: itemLat, lng: itemLng });
          distStr = fmtDistSimple(distM);
        }

        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `
          <div class="search-item-top">
            <div class="search-item-title">📍 ${esc(mainTitle)}</div>
            <span class="search-item-dist">${distStr}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div class="search-item-sub" style="flex:1;">${esc(subTitle)}</div>
            <span style="color:#00e676; font-size:16px; font-weight:900; white-space:nowrap;">設為集合點 ➔</span>
          </div>
        `;
        div.addEventListener('click', () => {
          setTargetPos(itemLat, itemLng, mainTitle, true);
          $('#searchModal').classList.add('hidden');
          focusTarget();
        });
        resultsEl.appendChild(div);
      });
    } catch (e) {
      toast('搜尋發生錯誤，請檢查網路連線');
    }
  }

  function setTargetPos(lat, lng, name, broadcast, useRetain = true) {
    state.targetPos = { lat, lng };
    state.targetName = name || '集合點';
    if (!state.targetMarker && state.map) {
      const targetIcon = L.divIcon({
        className: 'target-pin',
        html: '🚩',
        iconSize: [34, 34],
        iconAnchor: [17, 34]
      });
      state.targetMarker = L.marker([lat, lng], { icon: targetIcon })
        .addTo(state.map)
        .on('click', focusTarget);
    } else if (state.targetMarker) {
      state.targetMarker.setLatLng([lat, lng]);
    }

    saveLocalCache();
    updateTargetUI();
    renderItineraryList();
    
    if (broadcast && state.client && state.client.connected) {
      const msg = JSON.stringify({ type: 'set_target', lat, lng, name: state.targetName, id: state.id });
      state.client.publish(state.targetTopic, msg, { qos: 0, retain: !!useRetain });
      if (useRetain) {
        toast('🎯 已設定全體集合點：' + state.targetName);
        focusTarget();
      }
    }
  }

  function clearTargetPos(broadcast) {
    state.targetPos = null;
    state.targetName = '集合點';
    if (state.targetMarker && state.map) {
      state.map.removeLayer(state.targetMarker);
      state.targetMarker = null;
    }
    saveLocalCache();
    clearLine();
    updateTargetUI();
    renderItineraryList();

    if (broadcast && state.client && state.client.connected) {
      state.client.publish(state.targetTopic, '', { qos: 0, retain: true });
      toast('已取消集合點');
    }
  }

  function updateTargetUI() {
    const banner = $('#targetBanner');
    if (!state.targetPos) {
      banner.classList.add('hidden');
      return;
    }
    banner.classList.remove('hidden');
    const dist = state.myPos ? haversine(state.myPos, state.targetPos) : null;
    
    $('#targetName').textContent = state.targetName;
    $('#targetDistVal').textContent = fmtDistSimple(dist);
    $('#targetWalkEst').textContent = fmtTimeEstimate(dist);
    
    const q = new URLSearchParams({
      api: '1', destination: state.targetPos.lat + ',' + state.targetPos.lng, travelmode: 'walking'
    });
    if (state.myPos) q.set('origin', state.myPos.lat + ',' + state.myPos.lng);
    $('#targetNavBtn').href = 'https://www.google.com/maps/dir/?' + q.toString();
  }

  function focusTarget() {
    if (!state.targetPos || !state.map) return;
    clearLine();
    setFollowMode(false);
    const target = [state.targetPos.lat, state.targetPos.lng];

    if (state.myPos) {
      const mine = [state.myPos.lat, state.myPos.lng];
      state.map.fitBounds(L.latLngBounds([mine, target]).pad(0.35));
    } else {
      state.map.setView(target, 16);
    }
  }

  /* ================= 同伴與 SOS 管理 ================= */
  function upsertPeer(m) {
    let p = peers.get(m.id);
    const wasSOS = p ? p.isSOS : false;
    const wasLowBat = p ? (p.bat != null && p.bat <= 20 && !p.chg) : false;
    const oldStatus = p ? (p.status || '') : '';
    const newStatus = typeof m.status === 'string' ? m.status.trim() : oldStatus;

    if (!p) {
      p = {
        id: m.id, nickname: m.nickname || '同伴',
        color: hashColor(m.id),
        lat: m.lat, lng: m.lng, isSOS: !!m.isSOS,
        bat: typeof m.bat === 'number' ? m.bat : null,
        chg: !!m.chg,
        status: newStatus,
        ts: Date.now(), marker: null
      };
      peers.set(m.id, p);
      addPeerMarker(p);
    } else {
      if (m.nickname && m.nickname !== p.nickname) p.nickname = m.nickname;
      p.lat = m.lat; p.lng = m.lng; p.isSOS = !!m.isSOS;
      if (typeof m.bat === 'number') p.bat = m.bat;
      p.chg = !!m.chg;
      p.status = newStatus;
      p.ts = Date.now();
      if (p.marker) {
        p.marker.setLatLng([m.lat, m.lng]);
        p.marker.setIcon(iconFor(p.nickname, p.color, false, p.isSOS, false, p.status));
      }
    }

    if (!wasSOS && p.isSOS) {
      toast('🚨 警告：' + p.nickname + ' 發出了 SOS 求救訊號！', 8000);
    }

    const isLowBatNow = (p.bat != null && p.bat <= 20 && !p.chg);
    if (!wasLowBat && isLowBatNow) {
      toast(`🪫 注意：${p.nickname} 手機電量僅剩 ${p.bat}%！`, 6000);
    }

    if (newStatus && newStatus !== oldStatus) {
      toast(`💬 ${p.nickname}：${newStatus}`, 5000);
    }

    renderPeers();
  }

  function removePeer(id) {
    const p = peers.get(id);
    if (!p) return;
    if (p.marker && state.map) state.map.removeLayer(p.marker);
    peers.delete(id);
    renderPeers();
  }

  /* ================= 列表渲染 ================= */
  function navUrl(p) {
    const q = new URLSearchParams({
      api: '1', destination: p.lat + ',' + p.lng, travelmode: 'walking'
    });
    if (state.myPos) q.set('origin', state.myPos.lat + ',' + state.myPos.lng);
    return 'https://www.google.com/maps/dir/?' + q.toString();
  }

  function renderPeers() {
    const el = $('#peerList');
    const scrollTop = el.scrollTop;
    const now = Date.now();

    $('#topCount').textContent = peers.size + 1;

    const list = [...peers.values()].map(p => {
      const isOffline = (now - p.ts) > OFFLINE_MS;
      if (p.marker) {
        p.marker.setIcon(iconFor(p.nickname, p.color, false, p.isSOS, isOffline, p.status));
      }
      return {
        ...p,
        isOffline,
        dist: state.myPos ? haversine(state.myPos, p) : null
      };
    }).sort((a, b) => {
      if (a.isSOS !== b.isSOS) return a.isSOS ? -1 : 1; 
      return (a.dist ?? Infinity) - (b.dist ?? Infinity);
    });

    if (!list.length) {
      el.innerHTML = '<div class="empty">目前只有你一個人 🌱<br>把邀請連結傳給同伴加入吧！</div>';
      return;
    }

    el.innerHTML = list.map(p => {
      let batTag = '';
      if (p.bat !== null) {
        if (p.bat <= 20 && !p.chg) {
          batTag = `<span class="bat-low-tag">🪫 電量低 ${p.bat}%</span>`;
        } else {
          batTag = `<span class="bat-ok-tag">${p.chg ? '⚡' : '🔋'} ${p.bat}%</span>`;
        }
      }

      const offlineTag = p.isOffline ? `<span class="offline-tag">⚠️ 訊號中斷</span>` : '';
      const timeStatus = p.isOffline 
        ? `<span style="color:#ff9100;">訊號中斷中 (最後更新: ${ago(p.ts)})</span>` 
        : `更新於 ${ago(p.ts)}`;

      const statusBubble = p.status 
        ? `<div><span class="pstatus-bubble">${esc(p.status)}</span></div>` 
        : '';

      return `
      <div class="peer ${p.isSOS ? 'sos-active' : ''} ${p.isOffline ? 'offline' : ''}" onclick="focusPeer('${p.id}')">
        <span class="pdot" style="background:${p.isSOS ? '#ff1744' : (p.isOffline ? '#888' : p.color)}"></span>
        <div class="pinfo">
          <div class="pname">
            ${esc(p.nickname)}
            ${p.isSOS ? '<span class="sos-tag">SOS 求救中</span>' : ''}
            ${offlineTag}
            ${batTag}
          </div>
          ${statusBubble}
          <div class="pwalk">🚶 ${fmtTimeEstimate(p.dist)}</div>
          <div class="pmeta">${timeStatus}</div>
        </div>
        <a class="navbtn" href="${navUrl(p)}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()">導航</a>
      </div>`;
    }).join('');

    el.scrollTop = scrollTop;
  }

  /* ================= 互動邏輯 ================= */
  $('#panelToggle').addEventListener('click', () => {
    const list = $('#peerList');
    const icon = $('#toggleIcon');
    const isHidden = list.classList.toggle('hidden');
    icon.innerHTML = isHidden ? '▲ 展開' : '▼ 收合';
  });

  window.focusPeer = function (id) {
    const p = peers.get(id);
    if (!p || !state.map) return;
    clearLine();
    setFollowMode(false); 
    const target = [p.lat, p.lng];

    if (state.myPos) {
      const mine = [state.myPos.lat, state.myPos.lng];
      const d = haversine(state.myPos, p);
      state.line = L.polyline([mine, target], {
        color: p.isSOS ? '#ff1744' : p.color, weight: 6, dashArray: '10 10', opacity: 0.95
      }).addTo(state.map)
        .bindTooltip(`👤 ${esc(p.nickname)}<br>${fmtTimeEstimate(d)}`, {
          permanent: true, direction: 'center', className: 'lineTip'
        }).openTooltip();
      state.map.fitBounds(L.latLngBounds([mine, target]).pad(0.35));
    } else {
      state.map.setView(target, 17);
    }
    toast(`已顯示前往「${p.nickname}」的步行引導線`);
  };

  function setFollowMode(enable) {
    state.isFollowing = enable;
    const btn = $('#locBtn');
    const txt = $('#locTxt');
    if (enable) {
      btn.classList.add('following');
      txt.textContent = '跟隨中';
      if (state.myPos && state.map) {
        state.map.setView([state.myPos.lat, state.myPos.lng], 17);
      }
      toast('🎯 已開啟跟隨視角');
    } else {
      btn.classList.remove('following');
      txt.textContent = '定位';
    }
  }

  window.toggleFollowMe = function () {
    if (!state.myPos || !state.map) return toast('尚未取得定位');
    clearLine();
    setFollowMode(!state.isFollowing);
  };

  function toggleSOS() {
    state.isSOS = !state.isSOS;
    const btn = $('#sosBtn');
    if (state.isSOS) {
      btn.classList.add('active');
      toast('🚨 SOS 求救訊號已發送給所有同伴！', 5000);
    } else {
      btn.classList.remove('active');
      toast('已取消 SOS 求救狀態');
    }
    updateMeMarker();
    sendPos();
  }

  /* ================= MQTT 即時同步 (自動無縫帶入舊資料) ================= */
  function send(type, extra) {
    if (!state.client || !state.client.connected) return;
    const msg = Object.assign({
      type: type, id: state.id, nickname: state.nickname, ts: Date.now()
    }, extra || {});
    state.client.publish(state.topic, JSON.stringify(msg), { qos: 0 });
  }

  function sendPos() {
    if (!state.myPos) return;
    send('pos', { 
      lat: state.myPos.lat, 
      lng: state.myPos.lng, 
      acc: state.myPos.acc, 
      isSOS: state.isSOS,
      bat: state.batteryLevel,
      chg: state.isCharging,
      status: state.myStatus
    });
  }

  function setNet(on) { $('#netDot').classList.toggle('on', !!on); }

  function connectMQTT() {
    if (typeof mqtt === 'undefined') {
      toast('網路載入失敗，請重新整理');
      return;
    }
    state.client = mqtt.connect(BROKER, {
      clientId: 'geoact_' + state.id,
      clean: true, keepalive: 30, reconnectPeriod: 3000, connectTimeout: 10000
    });

    state.client.on('connect', () => {
      setNet(true);
      state.client.subscribe(state.topic, { qos: 0 });
      state.client.subscribe(state.targetTopic, { qos: 0 });
      state.client.subscribe(state.itineraryTopic, { qos: 0 }, err => {
        if (!err) {
          send('hello');        
          sendPos();            
        }
      });
    });

    state.client.on('message', (topic, buf) => {
      const payload = buf.toString();

      // 接收行程清單同步
      if (topic === state.itineraryTopic) {
        if (!payload) return;
        try {
          const t = JSON.parse(payload);
          if (t && t.type === 'sync_itinerary' && Array.isArray(t.list)) {
            if (t.senderId === state.id) return;
            const incomingTime = t.updatedAt || 1;
            // 只要對方的行程資料較新，或本地目前為空，就自動無條件帶入
            if (incomingTime >= state.itineraryUpdatedAt || state.itinerary.length === 0) {
              const hadEmpty = state.itinerary.length === 0 && t.list.length > 0;
              state.itinerary = t.list;
              state.itineraryUpdatedAt = incomingTime;
              saveLocalCache();
              renderItineraryList();
              if (hadEmpty) {
                toast(`📅 已自動帶入今日行程（共 ${t.list.length} 站）`);
              }
            }
          }
        } catch(e){}
        return;
      }

      // 接收集合點同步
      if (topic === state.targetTopic) {
        if (!payload) {
          clearTargetPos(false);
          return;
        }
        try {
          const t = JSON.parse(payload);
          if (t && t.type === 'set_target' && typeof t.lat === 'number') {
            if (t.id === state.id) return;
            setTargetPos(t.lat, t.lng, t.name, false);
          }
        } catch(e){}
        return;
      }

      let m;
      try { m = JSON.parse(payload); } catch (e) { return; }
      if (!m || !m.id) return;

      if (m.id !== state.id) {
        // 當新夥伴上線發送 hello 時，線上任何人直接自動把目前的行程與集合點推播給新夥伴！
        if (m.type === 'hello') {
          sendPos();
          if (state.itinerary.length > 0) {
            broadcastItinerary(false);
          }
          if (state.targetPos) {
            const targetMsg = JSON.stringify({
              type: 'set_target',
              lat: state.targetPos.lat,
              lng: state.targetPos.lng,
              name: state.targetName,
              id: state.id
            });
            state.client.publish(state.targetTopic, targetMsg, { qos: 0, retain: false });
          }
          return;
        }
        if (m.type === 'bye') { removePeer(m.id); return; }   
        if (m.type === 'pos' && typeof m.lat === 'number' && typeof m.lng === 'number') {
          upsertPeer(m);
        }
      }
    });

    state.client.on('reconnect', () => setNet(false));
    state.client.on('close',     () => setNet(false));
    state.client.on('error',     () => setNet(false));
  }

  /* ================= GPS 定位 ================= */
  function hideLoading() {
    const el = $('#loading');
    if (el) el.remove();
  }

  function onPos(pos) {
    const c = pos.coords;
    state.myPos = { lat: c.latitude, lng: c.longitude, acc: c.accuracy };
    hideLoading();

    if (!state.map) ensureMap([state.myPos.lat, state.myPos.lng]);
    updateMeMarker();

    if (!state.firstFix) {
      state.firstFix = true;
      setFollowMode(true); 
    } else if (state.isFollowing && state.map) {
      state.map.panTo([state.myPos.lat, state.myPos.lng]);
    }

    updateTargetUI();
    renderItineraryList();
    sendPos();
    renderPeers();
  }

  function onPosErr(err) {
    const map = {
      1: '定位權限被拒絕。請到手機設定允許定位後重整。',
      2: '目前無法取得定位訊號，請確認 GPS 已開啟。',
      3: '取得定位逾時，請到空曠處再試一次。'
    };
    const el = $('#loading');
    if (el) {
      el.innerHTML = '<b style="color:#ff5252;font-size:20px;">定位失敗</b><br>' + (map[err.code] || err.message);
    }
    toast(map[err.code] || '定位失敗');
  }

  function startGeo() {
    if (!navigator.geolocation) {
      toast('此瀏覽器不支援 GPS 定位');
      return;
    }
    state.watchId = navigator.geolocation.watchPosition(onPos, onPosErr, {
      enableHighAccuracy: true, maximumAge: 3000, timeout: 20000
    });
  }

  /* ================= 加入 / 離開 ================= */
  function join() {
    const code = $('#codeInput').value.trim();
    const nick = $('#nickInput').value.trim();

    if (!code) { toast('請輸入活動代號'); $('#codeInput').focus(); return; }
    if (!nick) { toast('請輸入你的暱稱'); $('#nickInput').focus(); return; }

    const safeCode = code.replace(/[^\w\u4e00-\u9fa5-]/g, '_');
    state.code = code;
    state.nickname = nick;
    state.topic = TOPIC_PREFIX + safeCode;
    state.targetTopic = TOPIC_PREFIX + safeCode + '/target';
    state.itineraryTopic = TOPIC_PREFIX + safeCode + '/itinerary';
    state.color = hashColor(state.id);

    $('#topCode').textContent = code;
    $('#joinScreen').classList.add('hidden');
    $('#mapScreen').classList.remove('hidden');

    loadLocalCache();

    state.joined = true;
    initBatteryMonitor();
    setupVoiceRecognition();
    startGeo();
    connectMQTT();
    requestWakeLock();

    setTimeout(() => {
      if (!state.map && state.joined) {
        ensureMap([25.0478, 121.5170]);
        state.map.setView([25.0478, 121.5170], 14);
        toast('尚未取得 GPS，地圖先以預設位置顯示');
      }
    }, 5000);

    try {
      const u = new URL(location.href);
      u.searchParams.set('code', code);
      history.replaceState(null, '', u);
    } catch (e) {}
  }

  function leave() {
    if (!confirm('確定要離開這個活動嗎？')) return;
    
    if (state.wakeLock !== null) {
      state.wakeLock.release().catch(() => {});
      state.wakeLock = null;
    }

    send('bye');
    setTimeout(() => {
      if (state.client) state.client.end(true);
      if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
      location.href = location.pathname;
    }, 250);
  }

  function copyInvite() {
    const url = location.origin + location.pathname + '?code=' + encodeURIComponent(state.code);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => toast('✅ 邀請連結已複製！'))
        .catch(() => toast(url, 6000));
    } else {
      toast(url, 6000);
    }
  }

  /* ================= 事件綁定 ================= */
  $('#joinBtn').addEventListener('click', join);
  $('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#nickInput').focus(); });
  $('#nickInput').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  $('#copyBtn').addEventListener('click', copyInvite);
  $('#leaveBtn').addEventListener('click', leave);
  $('#locBtn').addEventListener('click', window.toggleFollowMe);
  $('#sosBtn').addEventListener('click', toggleSOS);
  $('#clearTargetBtn').addEventListener('click', () => clearTargetPos(true));
  $('#focusTargetArea').addEventListener('click', () => {
    if (state.targetPos) focusTarget();
    else $('#itineraryModal').classList.remove('hidden');
  });

  // 行程清單視窗綁定
  $('#itineraryToggleBtn').addEventListener('click', () => {
    $('#itineraryModal').classList.remove('hidden');
    renderItineraryList();
  });
  $('#closeItineraryModal').addEventListener('click', () => {
    $('#itineraryModal').classList.add('hidden');
    $('#addStopBox').classList.add('hidden');
  });
  $('#addStopToggleBtn').addEventListener('click', () => {
    const box = $('#addStopBox');
    box.classList.toggle('hidden');
    if (!box.classList.contains('hidden')) $('#itinerarySearchInput').focus();
  });
  $('#itinerarySearchSubmit').addEventListener('click', () => {
    searchItineraryLocation($('#itinerarySearchInput').value);
  });
  $('#itinerarySearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchItineraryLocation($('#itinerarySearchInput').value);
  });

  // 狀態視窗綁定
  $('#statusToggleBtn').addEventListener('click', () => { $('#statusModal').classList.remove('hidden'); });
  $('#myStatusChip').addEventListener('click', () => { $('#statusModal').classList.remove('hidden'); });
  $('#closeStatusModal').addEventListener('click', () => { $('#statusModal').classList.add('hidden'); });
  document.querySelectorAll('.quick-status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setMyStatus(btn.getAttribute('data-status'));
      $('#statusModal').classList.add('hidden');
    });
  });
  $('#sendCustomStatusBtn').addEventListener('click', () => {
    const val = $('#customStatusInput').value.trim();
    if (!val) return toast('請輸入或說出狀態內容');
    setMyStatus('💬 ' + val);
    $('#customStatusInput').value = '';
    $('#statusModal').classList.add('hidden');
  });
  $('#customStatusInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('#sendCustomStatusBtn').click();
  });
  
  // 單一搜尋視窗綁定
  $('#searchToggleBtn').addEventListener('click', () => {
    $('#searchModal').classList.remove('hidden');
    $('#searchInput').focus();
  });
  $('#closeSearchModal').addEventListener('click', () => { $('#searchModal').classList.add('hidden'); });
  $('#searchSubmitBtn').addEventListener('click', () => { searchLocation($('#searchInput').value); });
  $('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation($('#searchInput').value); });

  window.addEventListener('beforeunload', () => { if (state.joined) send('bye'); });

  (function prefill() {
    const c = new URLSearchParams(location.search).get('code');
    if (c) $('#codeInput').value = c;
    $('#nickInput').focus();
  })();

  setInterval(() => { sendPos(); }, PING_MS);        
  setInterval(() => { renderPeers(); }, 10000);

})();
</script>
</body>
</html>
