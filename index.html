<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden;background:#000;}
  .screen{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---------- 加入畫面 ---------- */
  #joinScreen{
    display:flex;align-items:center;justify-content:center;padding:16px;
    background:#000; color:#fff; overflow-y:auto;
  }
  .card{
    width:100%;max-width:460px;background:#111;
    border:2px solid #555;border-radius:16px;padding:26px 20px;
  }
  .card h1{margin:0 0 10px;font-size:32px;letter-spacing:1px;color:#fff;}
  .sub{margin:0 0 18px;font-size:17px;color:#eee;line-height:1.55;font-weight:500;}
  label{display:block;font-size:18px;color:#ffeb3b;margin:15px 0 8px;font-weight:bold;letter-spacing:1px}
  input[type="text"], input:not([type="checkbox"]){
    width:100%;padding:15px;border-radius:12px;border:2.5px solid #666;
    background:#1c1c1c;color:#fff;font-size:21px;font-weight:bold;outline:none;transition:.2s;
  }
  input:focus{border-color:#ffeb3b;background:#000;}
  input::placeholder{color:#999;font-weight:normal;}

  .leader-check-row {
    display: flex; align-items: center; gap: 12px; margin-top: 18px;
    background: #1a180d; border: 2px solid #ffb300; border-radius: 12px;
    padding: 13px 14px; cursor: pointer; user-select: none;
  }
  .leader-check-row input[type="checkbox"] {
    width: 24px; height: 24px; accent-color: #ffb300; margin: 0; cursor: pointer; flex-shrink: 0;
  }
  .leader-check-text {
    font-size: 18px; font-weight: 900; color: #ffeb3b; line-height: 1.35;
  }
  .leader-check-sub {
    font-size: 14px; color: #ccc; font-weight: normal; display: block; margin-top: 2px;
  }

  button.primary{
    width:100%;margin-top:22px;padding:17px;border:0;border-radius:12px;font-size:23px;font-weight:900;
    background:#ffeb3b;color:#000;cursor:pointer;
    box-shadow:0 6px 15px rgba(255,235,59,.35);transition:.15s;
  }
  button.primary:active{transform:scale(.97);background:#fbc02d;}
  .hint{font-size:15px;color:#bbb;text-align:center;margin:16px 0 0;line-height:1.55}

  /* ---------- 地圖畫面 ---------- */
  #mapScreen{background:#000}
  #map{position:absolute;inset:0;background:#000}

  /* 頂部資訊列 */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    pointer-events:none;background:linear-gradient(to bottom, rgba(0,0,0,0.88) 65%, rgba(0,0,0,0));
  }
  #topbar > * { pointer-events:auto; }

  .chip{
    background:#000;color:#fff;border-radius:8px;padding:7px 11px;font-size:15px;font-weight:bold;
    display:flex;gap:5px;align-items:center;border:2px solid #666;white-space:nowrap; 
    max-width: 58vw; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .lbl{color:#ccc;}
  .chip b{color:#ffeb3b;font-size:16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  
  #leaderChip {
    background: #2b2100; border-color: #ffb300; color: #ffeb3b; cursor: pointer;
  }
  #lockIndicatorChip {
    background: #2b1111; border-color: #ff5252; color: #ff8a80; font-size: 14px;
  }
  #myStatusChip {
    background:#1b2e1e; border-color:#00e676; color:#fff; max-width:92vw; cursor:pointer;
  }
  #myStatusChip span { color:#ffeb3b; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #netDot{width:11px;height:11px;border-radius:50%;background:#ff3d00;transition:.3s;flex-shrink:0;}
  #netDot.on{background:#00e676;box-shadow:0 0 8px #00e676}

  /* 🚨 SOS 緊急求救全螢幕警示彈窗 */
  #sosAlertModal {
    position: fixed; inset: 0; z-index: 3600;
    background: rgba(90, 0, 0, 0.92);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  .sos-alert-card {
    background: #140404; border: 4px solid #ff1744; border-radius: 22px;
    padding: 26px 20px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 0 40px rgba(255, 23, 68, 0.9);
    display: flex; flex-direction: column; gap: 16px;
    animation: sosCardPulse 0.7s infinite alternate;
  }
  .sos-alert-icon { font-size: 56px; line-height: 1; }
  .sos-alert-title { margin: 0; font-size: 26px; font-weight: 900; color: #ffeb3b; letter-spacing: 1px; }
  .sos-alert-who {
    font-size: 22px; font-weight: 900; color: #fff;
    background: #b71c1c; border: 2px solid #ff8a80; border-radius: 12px;
    padding: 12px; line-height: 1.4;
  }
  .sos-alert-sub { font-size: 16px; color: #ffcdd2; line-height: 1.5; font-weight: bold; }
  .sos-ack-btn {
    width: 100%; padding: 18px; border-radius: 14px; border: 3px solid #000;
    background: #ffeb3b; color: #000; font-size: 21px; font-weight: 900;
    cursor: pointer; box-shadow: 0 6px 20px rgba(255, 235, 59, 0.5);
  }
  .sos-ack-btn:active { transform: scale(0.96); background: #fbc02d; }
  .sos-locate-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ff8a80;
    background: #2b0a0a; color: #fff; font-size: 18px; font-weight: 900;
    cursor: pointer;
  }
  .sos-locate-btn:active { background: #4a1010; }

  @keyframes sosCardPulse {
    0% { border-color: #ff1744; box-shadow: 0 0 24px rgba(255, 23, 68, 0.75); }
    100% { border-color: #ffeb3b; box-shadow: 0 0 44px rgba(255, 235, 59, 0.9); }
  }

  /* 🗺️ 地圖點選新增站點提示橫幅 */
  #mapPickBanner {
