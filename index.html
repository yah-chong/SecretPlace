<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow:hidden;background:#000;}
  .screen{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---------- 加入畫面 ---------- */
  #joinScreen{
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:#000; color:#fff; overflow-y:auto;
  }
  .card{
    width:100%;max-width:450px;background:#111;
    border:2px solid #444;border-radius:16px;padding:32px 24px;
    box-shadow:0 10px 30px rgba(255,255,255,0.1);
  }
  .card h1{margin:0 0 12px;font-size:32px;letter-spacing:1px;color:#fff;}
  .sub{margin:0 0 24px;font-size:18px;color:#ddd;line-height:1.6;font-weight:500;}
  label{display:block;font-size:18px;color:#ffeb3b;margin:20px 0 8px;font-weight:bold;letter-spacing:1px}
  input{
    width:100%;padding:18px;border-radius:12px;border:3px solid #555;
    background:#222;color:#fff;font-size:22px;font-weight:bold;outline:none;transition:.2s;
  }
  input:focus{border-color:#ffeb3b;background:#000;}
  input::placeholder{color:#888;font-weight:normal;}
  button.primary{
    width:100%;margin-top:32px;padding:20px;border:0;border-radius:12px;font-size:24px;font-weight:900;
    background:#ffeb3b;color:#000;cursor:pointer;
    box-shadow:0 6px 15px rgba(255,235,59,.4);transition:.15s;
  }
  button.primary:active{transform:scale(.96);background:#fbc02d;}
  .hint{font-size:16px;color:#aaa;text-align:center;margin:20px 0 0;line-height:1.6}

  /* ---------- 地圖畫面 ---------- */
  #mapScreen{background:#000}
  #map{position:absolute;inset:0;background:#000}

  /* 頂部資訊列：僅顯示代號與上線人數 */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;gap:8px;align-items:center;
    padding:12px;padding-top:calc(12px + env(safe-area-inset-top));
    pointer-events:none;background:linear-gradient(to bottom, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0));
  }
  #topbar > * { pointer-events:auto; }

  .chip{
    background:#000;color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:bold;
    display:flex;gap:6px;align-items:center;border:2px solid #555;white-space:nowrap; 
    max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .lbl{color:#aaa;}
  .chip b{color:#ffeb3b;font-size:16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
  
  #netDot{width:10px;height:10px;border-radius:50%;background:#ff3d00;transition:.3s;flex-shrink:0;}
  #netDot.on{background:#00e676;box-shadow:0 0 8px #00e676}

  /* 🔍 右側控制按鈕組 */
  .control-group {
    position:absolute;right:16px;top:38%;transform:translateY(-50%);z-index:1000;
    display:flex;flex-direction:column;gap:10px; align-items:flex-end;
  }
  
  /* 一般圓形按鈕 */
  .ctrl-btn {
    width:62px;height:62px;border-radius:50%;border:3px solid #fff;
    background:#000;color:#fff;font-size:22px;font-weight:bold;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    flex-direction:column;line-height:1.2;
  }
  .ctrl-btn:active{transform:scale(.94)}
  
  #sosBtn { background:#d32f2f; border-color:#ff5252; color:#fff; animation: pulse 2s infinite; }
  #sosBtn.active { background:#ff1744; border-color:#fff; animation: alertFlash .5s infinite alternate; }
  #locBtn.following { background:#00e676; color:#000; border-color:#fff; }
  #searchToggleBtn { background:#ffeb3b; color:#000; border-color:#fff; }

  /* 📄 方形「邀請」按鈕（保持原有符號與文字） */
  #copyBtn {
    width: 62px; height: 44px; border-radius: 8px; border: 2px solid #888;
    background: #111; color: #fff; font-size: 14px; font-weight: bold;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2px; line-height: 1.1;
    transition: .15s;
  }
  #copyBtn:active { transform: scale(0.94); background: #333; }

  /* 🚪 方形「離開」按鈕（與 SOS 拉開一個按鈕寬度以上的距離） */
  #leaveBtn {
    width: 62px; height: 44px; border-radius: 8px; border: 2.5px solid #ff5252;
    background: #1a0505; color: #ff5252; font-size: 15px; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    transition: .15s; margin-bottom: 24px; /* 拉開與下方 SOS 的距離 */
  }
  #leaveBtn:active { transform: scale(0.94); background: #3a0d0d; }

  /* 🔍 地點搜尋彈出視窗 */
  #searchModal {
    position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top));
    backdrop-filter: blur(5px);
  }
  .search-box-card {
    background: #111; border: 2px solid #ffeb3b; border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; max-width: 500px; width: 100%; margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
  }
